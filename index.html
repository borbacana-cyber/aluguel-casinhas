<style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
window.__db = db;
window.__fs = { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc };
window.__ready = true;
window.dispatchEvent(new Event("fb-ready"));
</script>

<script>
/* ═══════════════ CASINHAS · Controle de Aluguéis ═══════════════
   Coleções Firestore (prefixo al_ — não colide com cf_ do ContaCerta):
     al_imoveis · al_inquilinos · al_contratos · al_cobrancas
     al_caucao_mov · al_vistorias · al_despesas · al_config
════════════════════════════════════════════════════════════════ */
const { useState, useEffect, useMemo, useRef } = React;
const h = React.createElement;

const COL = {
  imoveis:   'al_imoveis',
  inquilinos:'al_inquilinos',
  contratos: 'al_contratos',
  cobrancas: 'al_cobrancas',
  caucao:    'al_caucao_mov',
  vistorias: 'al_vistorias',
  despesas:  'al_despesas',
  config:    'al_config'
};

/* ───────── utils ───────── */
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = v => {
  if (v === '' || v == null) return 0;
  if (typeof v === 'number') return isNaN(v) ? 0 : v;   // já é número (veio do Firestore) — não mexer
  let s = String(v).trim().replace(/[R$\s]/g,'');
  if (s === '') return 0;
  const temV = s.includes(','), temP = s.includes('.');
  if (temV && temP)      s = s.replace(/\./g,'').replace(',','.');  // 1.250,50 → 1250.50
  else if (temV)         s = s.replace(',','.');                    // 900,50   → 900.50
  else if (temP) {
    // só ponto: milhar (1.250) ou decimal (912.5 / 0.033)?
    const p = s.split('.');
    const ehMilhar = p.length > 2 ||                    // 1.250.000
      (p[p.length-1].length === 3 &&                    // último grupo com 3 dígitos…
       p[0] !== '0' && p[0] !== '' &&                   // …mas milhar não começa com "0."
       !/^0\d*$/.test(p[0]));
    if (ehMilhar) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const hoje = () => new Date().toISOString().slice(0,10);
const dbr  = d => d ? d.split('-').reverse().join('/') : '—';
const mesAtual = () => new Date().toISOString().slice(0,7);
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mesLabel = ym => { if(!ym) return '—'; const [a,m]=ym.split('-'); return MESES[+m-1]+'/'+a; };
const addMeses = (ymd, n) => {
  const d = new Date(ymd+'T12:00:00'); d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
};
const diasEntre = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000);
const soDigitos = s => String(s||'').replace(/\D/g,'');
const fmtTel = t => { const d=soDigitos(t); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t||'—'; };
const fmtCPF = c => { const d=soDigitos(c); return d.length===11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : (c||'—'); };
const uid = () => Math.random().toString(36).slice(2,9);
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ───────── PIX BR Code (EMV) ─────────
   Gera payload copia-e-cola estático com valor. */
function pixPayload({chave, nome, cidade, valor, txid}) {
  const f = (id, val) => id + String(val.length).padStart(2,'0') + val;
  const nm = semAcento(nome||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,25).trim() || 'RECEBEDOR';
  const cd = semAcento(cidade||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,15).trim() || 'BRASIL';
  const tx = semAcento(txid||'***').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,25) || '***';
  const mai = f('00','BR.GOV.BCB.PIX') + f('01', chave);
  let p = '';
  p += f('00','01');
  p += f('26', mai);
  p += f('52','0000');
  p += f('53','986');
  if (valor && Number(valor) > 0) p += f('54', Number(valor).toFixed(2));
  p += f('58','BR');
  p += f('59', nm);
  p += f('60', cd);
  p += f('62', f('05', tx));
  p += '6304';
  return p + crc16(p);
}
function crc16(str) {
  let crc = 0xFFFF;
  for (let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}

/* ───────── Firestore hook ───────── */
function useCol(name, ready) {
  const [data, setData] = useState([]);
  useEffect(() => {
    if (!ready) return;
    const { collection, onSnapshot } = window.__fs;
    const un = onSnapshot(collection(window.__db, name),
      s => setData(s.docs.map(d => ({ id: d.id, ...d.data() }))),
      e => console.error(name, e));
    return un;
  }, [name, ready]);
  return data;
}
const salvar = async (col, id, dados) => {
  const { addDoc, updateDoc, doc, collection } = window.__fs;
  if (id) await updateDoc(doc(window.__db, col, id), dados);
  else    await addDoc(collection(window.__db, col), dados);
};
const remover = async (col, id) => {
  const { deleteDoc, doc } = window.__fs;
  await deleteDoc(doc(window.__db, col, id));
};

/* ───────── componentes base ───────── */
const Modal = ({ title, onClose, children }) =>
  h('div',{className:'ov', onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{className:'md'},
      h('div',{className:'mh'},
        h('h3',null,title),
        h('button',{className:'x', onClick:onClose},'×')),
      children));

const Fld = ({ label, children }) =>
  h('div',{className:'fld'}, label && h('label',null,label), children);

const KV = ({ k, v, chip }) =>
  h('div',{className:'kv'},
    h('span',{className:'k'},k),
    h('span',{className:'v'}, chip ? h('span',{className:'chip '+chip.c},chip.t) : v));

const Empty = ({ i, t, d }) =>
  h('div',{className:'empty'},
    h('div',{className:'i'},i), h('div',{className:'t'},t), h('div',{className:'d'},d));

/* ───────── lógica de negócio ───────── */
function statusCobranca(c) {
  if (c.status === 'pago') return { t:'Pago', c:'c-ok' };
  const d = diasEntre(c.vencimento, hoje());
  if (d > 0)  return { t:`${d}d atrasado`, c:'c-bad' };
  if (d === 0) return { t:'Vence hoje', c:'c-warn' };
  if (d >= -5) return { t:`Vence em ${-d}d`, c:'c-warn' };
  return { t:'A vencer', c:'c-mut' };
}
function encargosDoMes(cob) {
  return num(cob.iptu) + num(cob.agua) + num(cob.luz) + num(cob.outros);
}
function totalCobranca(cob) {
  const base = num(cob.aluguel) + encargosDoMes(cob);
  const enc  = num(cob.multa) + num(cob.juros);
  return base + enc - num(cob.desconto);
}
function saldoCaucao(contratoId, movs) {
  return movs.filter(m => m.contratoId === contratoId)
             .reduce((s,m) => s + (m.tipo === 'entrada' ? num(m.valor) : -num(m.valor)), 0);
}

/* ══════════════════ APP ══════════════════ */
function App() {
  const [ready, setReady] = useState(!!window.__ready);
  useEffect(() => {
    if (window.__ready) return;
    const f = () => setReady(true);
    window.addEventListener('fb-ready', f);
    return () => window.removeEventListener('fb-ready', f);
  }, []);

  const [aba, setAba]     = useState('painel');
  const [toast, setToast] = useState('');
  const tst = m => { setToast(m); setTimeout(()=>setToast(''), 2200); };

  const imoveis    = useCol(COL.imoveis, ready);
  const inquilinos = useCol(COL.inquilinos, ready);
  const contratos  = useCol(COL.contratos, ready);
  const cobrancas  = useCol(COL.cobrancas, ready);
  const caucaoMov  = useCol(COL.caucao, ready);
  const vistorias  = useCol(COL.vistorias, ready);
  const despesas   = useCol(COL.despesas, ready);
  const cfgArr     = useCol(COL.config, ready);
  const cfg        = cfgArr[0] || {};

  const [modal, setModal] = useState(null); // {tipo, dados}
  const abrir = (tipo, dados=null) => setModal({tipo, dados});
  const fechar = () => setModal(null);

  const ctx = { imoveis, inquilinos, contratos, cobrancas, caucaoMov, vistorias, despesas,
                cfg, abrir, fechar, tst, setAba };

  if (!ready) return h('div',{className:'load'}, h('div',{className:'spin'}), h('div',null,'Conectando…'));

  const ABAS = [
    ['painel','🏠 Painel'], ['cobrancas','💰 Cobranças'], ['contratos','📄 Contratos'],
    ['imoveis','🏘️ Casas'], ['despesas','🔧 Despesas'], ['config','⚙️ Config']
  ];

  return h('div',null,
    h('div',{className:'top'},
      h('h1',null,'🏘️ Casinhas'),
      h('div',{className:'sub'}, `${imoveis.length} casas · ${contratos.filter(c=>c.status==='vigente').length} alugadas`)),
    h('div',{className:'tabs'},
      ABAS.map(([k,l]) => h('button',{key:k, className:'tab'+(aba===k?' on':''), onClick:()=>setAba(k)}, l))),
    h('div',{className:'wrap'},
      aba==='painel'    && h(Painel, ctx),
      aba==='cobrancas' && h(Cobrancas, ctx),
      aba==='contratos' && h(Contratos, ctx),
      aba==='imoveis'   && h(Imoveis, ctx),
      aba==='despesas'  && h(Despesas, ctx),
      aba==='config'    && h(Config, ctx)),
    modal && h(Roteador, {...ctx, modal}),
    toast && h('div',{className:'toast'}, toast));
}

/* ══════════════════ PAINEL ══════════════════ */
function Painel(p) {
  const { contratos, imoveis, inquilinos, cobrancas, caucaoMov, abrir, setAba } = p;
  const vig = contratos.filter(c => c.status === 'vigente');
  const im  = id => imoveis.find(x=>x.id===id) || {};
  const iq  = id => inquilinos.find(x=>x.id===id) || {};

  const abertas   = cobrancas.filter(c => c.status !== 'pago');
  const atrasadas = abertas.filter(c => diasEntre(c.vencimento, hoje()) > 0);
  const receber   = abertas.reduce((s,c)=>s+totalCobranca(c),0);
  const atraso    = atrasadas.reduce((s,c)=>s+totalCobranca(c),0);
  const mensal    = vig.reduce((s,c)=>s+num(c.valorAluguel),0);

  const pagasMes = cobrancas.filter(c => c.status==='pago' && (c.dataPagamento||'').slice(0,7)===mesAtual());
  const recebido = pagasMes.reduce((s,c)=>s+totalCobranca(c),0);

  // reajustes próximos 60 dias
  const reaj = vig.filter(c => c.proximoReajuste && diasEntre(hoje(), c.proximoReajuste) <= 60)
                  .sort((a,b)=>a.proximoReajuste.localeCompare(b.proximoReajuste));
  // contratos vencendo em 90 dias
  const venc = vig.filter(c => c.dataFim && diasEntre(hoje(), c.dataFim) <= 90)
                  .sort((a,b)=>a.dataFim.localeCompare(b.dataFim));
  const vagas = imoveis.filter(i => !vig.find(c=>c.imovelId===i.id));

  return h('div',null,
    h('div',{className:'row r2', style:{marginBottom:'10px'}},
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--brand)'}}, brl(mensal)),
        h('div',{className:'l'},'Aluguel/mês')),
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--ok)'}}, brl(recebido)),
        h('div',{className:'l'},'Recebido este mês'))),
    h('div',{className:'row r2', style:{marginBottom:'14px'}},
      h('div',{className:'stat'}, h('div',{className:'n', style:{color: atraso>0?'var(--bad)':'var(--mut)'}}, brl(atraso)),
        h('div',{className:'l'},`Em atraso (${atrasadas.length})`)),
      h('div',{className:'stat'}, h('div',{className:'n'}, brl(receber)),
        h('div',{className:'l'},`A receber (${abertas.length})`))),

    atrasadas.length > 0 && h('div',{className:'alert a-bad'},
      h('span',null,'⚠️'),
      h('div',null, h('b',null,`${atrasadas.length} cobrança(s) em atraso`), ' — ',
        h('a',{href:'#', className:'lnk', onClick:e=>{e.preventDefault();setAba('cobrancas');}},'ver e cobrar'))),

    reaj.length > 0 && h('div',{className:'alert a-warn'},
      h('span',null,'📈'),
      h('div',null, h('b',null,'Reajuste chegando'),
        reaj.map(c => h('div',{key:c.id, style:{marginTop:'3px'}},
          `${im(c.imovelId).nome||'?'} — ${dbr(c.proximoReajuste)} `,
          h('a',{href:'#', className:'lnk', onClick:e=>{e.preventDefault();abrir('reajuste',c);}},'aplicar'))))),

    venc.length > 0 && h('div',{className:'alert a-info'},
      h('span',null,'📄'),
      h('div',null, h('b',null,'Contrato vencendo'),
        venc.map(c => h('div',{key:c.id, style:{marginTop:'3px'}},
          `${im(c.imovelId).nome||'?'} — ${dbr(c.dataFim)} (${diasEntre(hoje(),c.dataFim)} dias)`)))),

    vagas.length > 0 && h('div',{className:'alert a-warn'},
      h('span',null,'🔑'),
      h('div',null, h('b',null,`${vagas.length} casa(s) sem contrato vigente: `),
        vagas.map(v=>v.nome).join(', '))),

    h('div',{className:'sec'},'Casas alugadas'),
    vig.length === 0
      ? h(Empty,{i:'🏘️', t:'Nenhum contrato vigente', d:'Cadastre as casas e depois os contratos.'})
      : vig.slice().sort((a,b)=>(im(a.imovelId).nome||'').localeCompare(im(b.imovelId).nome||''))
          .map(c => {
        const i = im(c.imovelId), q = iq(c.inquilinoId);
        const ab = cobrancas.filter(x => x.contratoId===c.id && x.status!=='pago');
        const at = ab.filter(x => diasEntre(x.vencimento, hoje()) > 0);
        const sc = saldoCaucao(c.id, caucaoMov);
        return h('div',{key:c.id, className:'card clk', onClick:()=>abrir('verContrato', c)},
          h('div',{className:'ch'},
            h('div',null,
              h('div',{className:'ct'}, i.nome || '(sem casa)'),
              h('div',{className:'cs'}, q.nome || '(sem inquilino)', ' · venc. dia ', c.diaVencimento||'—')),
            at.length > 0
              ? h('span',{className:'chip c-bad'}, `${at.length} atraso`)
              : ab.length > 0
                ? h('span',{className:'chip c-warn'}, `${ab.length} aberta`)
                : h('span',{className:'chip c-ok'},'Em dia')),
          h('div',{style:{display:'flex',gap:'6px',marginTop:'9px',flexWrap:'wrap'}},
            h('span',{className:'chip c-brand'}, brl(num(c.valorAluguel))),
            sc > 0 && h('span',{className:'chip c-mut'}, '🔒 caução ', brl(sc)),
            c.proximoReajuste && h('span',{className:'chip c-mut'}, '📈 ', dbr(c.proximoReajuste))));
      }));
}

/* ══════════════════ COBRANÇAS ══════════════════ */
function Cobrancas(p) {
  const { cobrancas, contratos, imoveis, inquilinos, cfg, abrir, tst } = p;
  const [filtro, setFiltro] = useState('abertas');
  const [mesGer, setMesGer] = useState(mesAtual());
  const im = id => imoveis.find(x=>x.id===id) || {};
  const ct = id => contratos.find(x=>x.id===id) || {};
  const iq = id => inquilinos.find(x=>x.id===id) || {};

  const lista = useMemo(() => {
    let L = cobrancas.slice();
    if (filtro==='abertas')  L = L.filter(c=>c.status!=='pago');
    if (filtro==='atrasadas')L = L.filter(c=>c.status!=='pago' && diasEntre(c.vencimento,hoje())>0);
    if (filtro==='pagas')    L = L.filter(c=>c.status==='pago');
    if (filtro==='mes')      L = L.filter(c=>c.competencia===mesAtual());
    return L.sort((a,b)=> (a.vencimento||'').localeCompare(b.vencimento||''));
  }, [cobrancas, filtro]);

  const total = lista.reduce((s,c)=>s+totalCobranca(c),0);

  // cobranças abertas que ainda precisam de água/luz digitados
  const pendEncargo = cobrancas.filter(c => {
    if (c.status==='pago') return false;
    const t = ct(c.contratoId);
    return (t.aguaNoNomeDela && !num(c.agua)) || (t.luzNoNomeDela && !num(c.luz));
  });

  const gerarMes = async () => {
    const comp = mesGer;
    const vig = contratos.filter(c=>c.status==='vigente');
    if (!vig.length) return tst('Nenhum contrato vigente');
    let n = 0;
    for (const c of vig) {
      if (cobrancas.find(x=>x.contratoId===c.id && x.competencia===comp)) continue;
      const dia = String(c.diaVencimento||10).padStart(2,'0');
      await salvar(COL.cobrancas, null, {
        contratoId: c.id, imovelId: c.imovelId, inquilinoId: c.inquilinoId,
        competencia: comp, vencimento: `${comp}-${dia}`,
        aluguel: num(c.valorAluguel),
        iptu: 0, agua: 0, luz: 0, outros: 0, multa: 0, juros: 0, desconto: 0,
        status: 'aberta', criadoEm: new Date().toISOString()
      });
      n++;
    }
    tst(n ? `${n} cobrança(s) gerada(s) para ${mesLabel(comp)}` : `Todas já existem em ${mesLabel(comp)}`);
  };

  return h('div',null,
    h('div',{className:'card', style:{padding:'12px'}},
      h('label',null,'Gerar cobranças do mês'),
      h('div',{style:{display:'flex', gap:'8px'}},
        h('input',{type:'month', value:mesGer, onChange:e=>setMesGer(e.target.value),
          style:{flex:'0 0 145px'}}),
        h('button',{className:'btn b-pri', style:{flex:1}, onClick:gerarMes},'⚡ Gerar')),
      h('div',{style:{fontSize:'11.5px', color:'var(--mut)', marginTop:'7px'}},
        'Cria uma cobrança para cada contrato vigente. Não duplica se já existir.')),

    h('button',{className:'btn b-sec b-full b-sm', style:{marginBottom:'12px'},
      onClick:()=>abrir('cobranca')},'+ Cobrança avulsa'),

    pendEncargo.length > 0 && h('div',{className:'alert a-warn'},
      h('span',null,'💧'),
      h('div',null, h('b',null,`${pendEncargo.length} cobrança(s) sem água/luz preenchidos`),
        h('div',{style:{fontSize:'12px'}},
          'Esses contratos têm a conta no nome da proprietária. Abra a cobrança e digite o valor do mês antes de enviar.'))),

    h('div',{className:'pill-nav'},
      [['abertas','Abertas'],['atrasadas','Atrasadas'],['mes','Este mês'],['pagas','Pagas'],['todas','Todas']]
        .map(([k,l]) => h('button',{key:k, className:'pill'+(filtro===k?' on':''), onClick:()=>setFiltro(k)}, l))),

    lista.length > 0 && h('div',{className:'alert a-info'},
      h('span',null,'Σ'), h('div',null, h('b',null, lista.length, ' cobrança(s) · ', brl(total)))),

    lista.length === 0
      ? h(Empty,{i:'💰', t:'Nada aqui', d:'Use "Gerar" para criar as cobranças do mês.'})
      : lista.map(c => {
        const st = statusCobranca(c), i = im(c.imovelId), q = iq(c.inquilinoId);
        const t = ct(c.contratoId);
        const falta = c.status!=='pago' &&
          ((t.aguaNoNomeDela && !num(c.agua)) || (t.luzNoNomeDela && !num(c.luz)));
        return h('div',{key:c.id, className:'card clk', onClick:()=>abrir('verCobranca', c)},
          h('div',{className:'ch'},
            h('div',null,
              h('div',{className:'ct'}, i.nome||'?', ' · ', mesLabel(c.competencia)),
              h('div',{className:'cs'}, q.nome||'?', ' · vence ', dbr(c.vencimento))),
            h('div',{style:{textAlign:'right'}},
              h('div',{style:{fontWeight:800, fontSize:'15px'}}, brl(totalCobranca(c))),
              h('span',{className:'chip '+st.c, style:{marginTop:'3px'}}, st.t))),
          falta && h('div',{style:{marginTop:'7px'}},
            h('span',{className:'chip c-warn'},'💧 falta água/luz')));
      }));
}

/* ══════════════════ CONTRATOS ══════════════════ */

      h('button',{className:'btn b-pri b-full', onClick:()=>abrir('contrato')},'+ Novo contrato'),

          h('div',{className:'ch'},
            h('div',null,
              h('div',{className:'ct'}, i.nome||'?'),
              h('div',{className:'cs'}, q.nome||'?')),
            h('span',{className:'chip '+(c.status==='vigente'?'c-ok':'c-mut')},

          h('div',{style:{display:'flex',gap:'6px',marginTop:'9px',flexWrap:'wrap'}},
            h('span',{className:'chip c-brand'}, brl(num(c.valorAluguel))),
            h('span',{className:'chip c-mut'}, dbr(c.dataInicio),' → ',dbr(c.dataFim)),
            sc>0 && h('span',{className:'chip c-mut'},'🔒 ',brl(sc))));
      }));
}

              h('div',{className:'ct'}, i.nome),

}

/* ══════════════════ DESPESAS ══════════════════ */
function Despesas(p) {
  const { despesas, imoveis, cobrancas, contratos, abrir } = p;
  const [mes, setMes] = useState(mesAtual());
  const im = id => imoveis.find(x=>x.id===id) || {};
  const L = despesas.filter(d => (d.data||'').slice(0,7)===mes)
                    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const tot = L.reduce((s,d)=>s+num(d.valor),0);
  const rec = cobrancas.filter(c=>c.status==='pago' && (c.dataPagamento||'').slice(0,7)===mes)
                       .reduce((s,c)=>s+totalCobranca(c),0);

  // rentabilidade por casa (12 meses)
  const ini = addMeses(hoje(), -12).slice(0,7);
  const porCasa = imoveis.map(i => {
    const r = cobrancas.filter(c=>c.imovelId===i.id && c.status==='pago' && (c.dataPagamento||'')>=ini)
                       .reduce((s,c)=>s+totalCobranca(c),0);
    const d = despesas.filter(x=>x.imovelId===i.id && (x.data||'')>=ini)
                      .reduce((s,x)=>s+num(x.valor),0);
    return { ...i, rec:r, desp:d, liq:r-d };
  }).sort((a,b)=>b.liq-a.liq);

  return h('div',null,
    h('div',{className:'btns', style:{marginBottom:'12px'}},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:()=>abrir('despesa')},'+ Nova despesa'),
      h('input',{type:'month', value:mes, onChange:e=>setMes(e.target.value), style:{maxWidth:'150px'}})),

    h('div',{className:'row r3', style:{marginBottom:'14px'}},
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--ok)', fontSize:'15px'}}, brl(rec)),
        h('div',{className:'l'},'Recebido')),
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--bad)', fontSize:'15px'}}, brl(tot)),
        h('div',{className:'l'},'Gasto')),
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--brand)', fontSize:'15px'}}, brl(rec-tot)),
        h('div',{className:'l'},'Líquido'))),

    h('div',{className:'sec'},'Despesas de ', mesLabel(mes)),
    L.length===0
      ? h('div',{className:'card', style:{textAlign:'center', color:'var(--mut)', fontSize:'13px'}},
          'Nenhuma despesa neste mês.')
      : L.map(d => h('div',{key:d.id, className:'card clk', onClick:()=>abrir('despesa', d)},
          h('div',{className:'ch'},
            h('div',null,
              h('div',{className:'ct', style:{fontSize:'14px'}}, d.descricao),
              h('div',{className:'cs'}, im(d.imovelId).nome||'Geral',' · ',dbr(d.data),
                d.categoria ? ' · '+d.categoria : '')),
            h('div',{style:{fontWeight:800, color:'var(--bad)'}}, brl(num(d.valor)))))),

    h('div',{className:'sec'},'Rentabilidade · últimos 12 meses'),
    porCasa.length===0
      ? h('div',{className:'card', style:{textAlign:'center', color:'var(--mut)', fontSize:'13px'}},'—')
      : h('div',{className:'card'},
          porCasa.map(c => h('div',{key:c.id, className:'kv'},
            h('span',{className:'k'}, c.nome),
            h('span',{className:'v', style:{color: c.liq>=0?'var(--ok)':'var(--bad)'}},
              brl(c.liq),
              h('div',{style:{fontSize:'11px', fontWeight:400, color:'var(--mut)'}},
                brl(c.rec),' − ',brl(c.desp)))))));
}

/* ══════════════════ CONFIG ══════════════════ */
function Config(p) {
  const { cfg, tst, imoveis, inquilinos, contratos, cobrancas, despesas, caucaoMov, vistorias, abrir } = p;
  const [f, setF] = useState({
    pixChave: cfg.pixChave||'', pixNome: cfg.pixNome||'', pixCidade: cfg.pixCidade||'',
    igpmAcum: cfg.igpmAcum||'', igpmRef: cfg.igpmRef||'',
    multaAtraso: cfg.multaAtraso ?? 2, jurosDia: cfg.jurosDia ?? 0.033
  });
  useEffect(()=>{ setF({
    pixChave: cfg.pixChave||'', pixNome: cfg.pixNome||'', pixCidade: cfg.pixCidade||'',
    igpmAcum: cfg.igpmAcum||'', igpmRef: cfg.igpmRef||'',
    multaAtraso: cfg.multaAtraso ?? 2, jurosDia: cfg.jurosDia ?? 0.033
  }); }, [cfg.id]);

  const gravar = async () => {
    const { setDoc, doc } = window.__fs;
    await setDoc(doc(window.__db, COL.config, cfg.id || 'principal'), {
      ...f, pixChave: soDigitos(f.pixChave) || f.pixChave,
      multaAtraso: num(f.multaAtraso), jurosDia: num(f.jurosDia)
    }, { merge:true });
    tst('Configurações salvas ✓');
  };

  const teste = f.pixChave ? pixPayload({
    chave: soDigitos(f.pixChave)||f.pixChave, nome: f.pixNome, cidade: f.pixCidade,
    valor: 100, txid:'TESTE'
  }) : '';

  const exportar = () => {
    const j = { imoveis, inquilinos, contratos, cobrancas, despesas, caucaoMov, vistorias, cfg,
                exportadoEm: new Date().toISOString() };
    const b = new Blob([JSON.stringify(j,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `casinhas-backup-${hoje()}.json`;
    a.click();
    tst('Backup baixado ✓');
  };

  return h('div',null,
    h('div',{className:'sec'},'Chave PIX do recebedor'),
    h('div',{className:'card'},
      h('div',{className:'alert a-info', style:{marginBottom:'12px'}},
        h('span',null,'ℹ️'),
        h('div',null,'Preencha com o CPF da sua mãe (só números), o nome como está no banco e a cidade. É o que vai dentro do código PIX.')),
      h(Fld,{label:'Chave PIX — CPF (só números)'},
        h('input',{value:f.pixChave, inputMode:'numeric', placeholder:'12345678909',
          onChange:e=>setF({...f, pixChave:e.target.value})})),
      h(Fld,{label:'Nome do recebedor (máx. 25 caracteres)'},
        h('input',{value:f.pixNome, maxLength:25, placeholder:'MARIA DA SILVA',
          onChange:e=>setF({...f, pixNome:e.target.value})})),
      h(Fld,{label:'Cidade (máx. 15 caracteres)'},
        h('input',{value:f.pixCidade, maxLength:15, placeholder:'SOROCABA',
          onChange:e=>setF({...f, pixCidade:e.target.value})})),
      teste && h('div',null,
        h('label',null,'Código de teste (R$ 100,00) — cole no app do banco para validar'),
        h('div',{className:'pix'}, teste),
        h('button',{className:'btn b-sec b-sm', style:{marginTop:'8px'},
          onClick:()=>{navigator.clipboard.writeText(teste); tst('Copiado');}},'📋 Copiar teste'))),

    h('div',{className:'sec'},'Reajuste'),
    h('div',{className:'card'},
      h('div',{className:'row r2'},
        h(Fld,{label:'IGP-M acumulado 12m (%)'},
          h('input',{value:f.igpmAcum, inputMode:'decimal', placeholder:'4,50',
            onChange:e=>setF({...f, igpmAcum:e.target.value})})),
        h(Fld,{label:'Referente a'},
          h('input',{type:'month', value:f.igpmRef,
            onChange:e=>setF({...f, igpmRef:e.target.value})}))),
      h('div',{style:{fontSize:'12px', color:'var(--mut)'}},
        'Isso é só uma sugestão exibida na hora do reajuste. Você sempre digita o % final negociado.')),

    h('div',{className:'sec'},'Padrão de multa/juros por atraso'),
    h('div',{className:'card'},
      h('div',{className:'row r2'},
        h(Fld,{label:'Multa (%)'},
          h('input',{value:f.multaAtraso, inputMode:'decimal',
            onChange:e=>setF({...f, multaAtraso:e.target.value})})),
        h(Fld,{label:'Juros ao dia (%)'},
          h('input',{value:f.jurosDia, inputMode:'decimal',
            onChange:e=>setF({...f, jurosDia:e.target.value})}))),
      h('div',{style:{fontSize:'12px', color:'var(--mut)'}},
        '0,033%/dia ≈ 1% ao mês. Aplicado com um clique na tela da cobrança.')),

    h('button',{className:'btn b-pri b-full', style:{marginTop:'6px'}, onClick:gravar},'💾 Salvar configurações'),

    h('div',{className:'sec'},'Dados'),
    h('div',{className:'card'},
      h('div',{className:'kv'}, h('span',{className:'k'},'Casas'), h('span',{className:'v'}, imoveis.length)),
      h('div',{className:'kv'}, h('span',{className:'k'},'Inquilinos'), h('span',{className:'v'}, inquilinos.length)),
      h('div',{className:'kv'}, h('span',{className:'k'},'Contratos'), h('span',{className:'v'}, contratos.length)),
      h('div',{className:'kv'}, h('span',{className:'k'},'Cobranças'), h('span',{className:'v'}, cobrancas.length)),
      h('div',{className:'kv'}, h('span',{className:'k'},'Despesas'), h('span',{className:'v'}, despesas.length)),
      h('button',{className:'btn b-sec b-full', style:{marginTop:'12px'}, onClick:exportar},
        '⬇️ Baixar backup (JSON)')));
}

/* ══════════════════ ROTEADOR DE MODAIS ══════════════════ */
function Roteador(p) {
  const t = p.modal.tipo;
  const M = {
    imovel: FormImovel, verImovel: VerImovel,
    contrato: FormContrato, verContrato: VerContrato,
    inquilinos: ListaInquilinos, inquilino: FormInquilino,
    cobranca: FormCobranca, verCobranca: VerCobranca,
    despesa: FormDespesa, reajuste: FormReajuste,
    caucao: FormCaucao, vistoria: FormVistoria
  }[t];
  return M ? h(M, p) : null;
}

  const i0 = p.modal.dados;

function FormContrato(p) {
  const d = p.modal.dados || {};
  const [f, setF] = useState({
    imovelId:d.imovelId||'', inquilinoId:d.inquilinoId||'',
    dataInicio:d.dataInicio||hoje(), prazoMeses:d.prazoMeses||30,
    dataFim:d.dataFim||addMeses(hoje(),30),
    diaVencimento:d.diaVencimento||10, valorAluguel:d.valorAluguel||'',
    indice:d.indice||'IGP-M',
    proximoReajuste:d.proximoReajuste||addMeses(hoje(),12),
    iptuPorConta:d.iptuPorConta||'inquilino',
    aguaNoNomeDela: d.aguaNoNomeDela ?? false,
    luzNoNomeDela:  d.luzNoNomeDela ?? false,
    multaAtraso:d.multaAtraso ?? (p.cfg.multaAtraso ?? 2),
    jurosDia:d.jurosDia ?? (p.cfg.jurosDia ?? 0.033),
    multaRescisoria:d.multaRescisoria||'3 aluguéis proporcionais',
    linkContrato:d.linkContrato||'',
    caucaoValor:d.caucaoValor||'', caucaoData:d.caucaoData||hoje(),
    status:d.status||'vigente', obs:d.obs||''
  });

  const setPrazo = v => {
    const n = parseInt(v)||0;
    setF(x => ({...x, prazoMeses:v, dataFim: n>0 ? addMeses(x.dataInicio, n) : x.dataFim }));
  };
  const setInicio = v => {
    const n = parseInt(f.prazoMeses)||0;
    setF(x => ({...x, dataInicio:v, dataFim: n>0?addMeses(v,n):x.dataFim,
      proximoReajuste: addMeses(v,12) }));
  };

  const ok = async () => {
    if (!f.imovelId)    return p.tst('Escolha a casa');
    if (!f.inquilinoId) return p.tst('Escolha o inquilino');
    if (num(f.valorAluguel) <= 0) return p.tst('Informe o valor do aluguel');
    const dados = {
      ...f, valorAluguel:num(f.valorAluguel), diaVencimento:parseInt(f.diaVencimento)||10,
      prazoMeses:parseInt(f.prazoMeses)||0,
      multaAtraso:num(f.multaAtraso), jurosDia:num(f.jurosDia)
    };
    delete dados.caucaoValor; delete dados.caucaoData;
    const novo = !d.id;
    const { addDoc, updateDoc, doc, collection } = window.__fs;
    let cid = d.id;
    if (novo) {
      const r = await addDoc(collection(window.__db, COL.contratos), dados);
      cid = r.id;
    } else {
      await updateDoc(doc(window.__db, COL.contratos, d.id), dados);
    }
    if (novo && num(f.caucaoValor) > 0) {
      await salvar(COL.caucao, null, {
        contratoId: cid, tipo:'entrada', valor:num(f.caucaoValor),
        data: f.caucaoData, motivo:'Caução recebida na assinatura'
      });
    }
    p.tst(novo?'Contrato criado ✓':'Contrato atualizado ✓'); p.fechar();
  };
  const del = async () => {
    if (!confirm('Excluir este contrato? As cobranças NÃO serão apagadas.')) return;
    await remover(COL.contratos, d.id); p.tst('Excluído'); p.fechar();
  };

  return h(Modal,{title: d.id?'Editar contrato':'Novo contrato', onClose:p.fechar},
    h(Fld,{label:'Casa *'},
      h('select',{value:f.imovelId, onChange:e=>setF({...f,imovelId:e.target.value})},
        h('option',{value:''},'— escolha —'),
        p.imoveis.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    h(Fld,{label:'Inquilino *'},
      h('select',{value:f.inquilinoId, onChange:e=>setF({...f,inquilinoId:e.target.value})},
        h('option',{value:''},'— escolha —'),
        p.inquilinos.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    p.inquilinos.length===0 && h('div',{className:'alert a-warn'},
      h('span',null,'⚠️'),
      h('div',null,'Nenhum inquilino cadastrado. ',
        h('a',{href:'#', className:'lnk', onClick:e=>{e.preventDefault();p.abrir('inquilino');}},'Cadastrar agora'))),

    h('div',{className:'row r3'},
      h(Fld,{label:'Início'}, h('input',{type:'date', value:f.dataInicio, onChange:e=>setInicio(e.target.value)})),
      h(Fld,{label:'Prazo (meses)'}, h('input',{value:f.prazoMeses, inputMode:'numeric', onChange:e=>setPrazo(e.target.value)})),
      h(Fld,{label:'Fim'}, h('input',{type:'date', value:f.dataFim, onChange:e=>setF({...f,dataFim:e.target.value})}))),

    h('div',{className:'row r2'},
      h(Fld,{label:'Valor do aluguel *'},
        h('input',{value:f.valorAluguel, inputMode:'decimal', placeholder:'900,00',
          onChange:e=>setF({...f,valorAluguel:e.target.value})})),
      h(Fld,{label:'Dia de vencimento'},
        h('input',{value:f.diaVencimento, inputMode:'numeric',
          onChange:e=>setF({...f,diaVencimento:e.target.value})}))),

    h('div',{className:'row r2'},
      h(Fld,{label:'Índice de reajuste'},
        h('select',{value:f.indice, onChange:e=>setF({...f,indice:e.target.value})},
          ['IGP-M','IPCA','INCC','Livre / negociado'].map(x=>h('option',{key:x},x)))),
      h(Fld,{label:'Próximo reajuste'},
        h('input',{type:'date', value:f.proximoReajuste,
          onChange:e=>setF({...f,proximoReajuste:e.target.value})}))),

    h('div',{className:'sec'},'Encargos'),
    h(Fld,{label:'IPTU por conta de'},
      h('select',{value:f.iptuPorConta, onChange:e=>setF({...f,iptuPorConta:e.target.value})},
        h('option',{value:'inquilino'},'Inquilino (repassar na cobrança)'),
        h('option',{value:'proprietario'},'Proprietária (não cobrar)'))),
    h('div',{className:'card', style:{background:'#fafbfc', padding:'6px 12px'}},
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.aguaNoNomeDela,
          onChange:e=>setF({...f,aguaNoNomeDela:e.target.checked})}),
        h('span',null,'💧 Conta de água no nome da proprietária ',
          h('span',{style:{color:'var(--mut)', fontSize:'12px'}},'(será cobrada junto)'))),
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.luzNoNomeDela,
          onChange:e=>setF({...f,luzNoNomeDela:e.target.checked})}),
        h('span',null,'💡 Conta de luz no nome da proprietária ',
          h('span',{style:{color:'var(--mut)', fontSize:'12px'}},'(será cobrada junto)')))),

    h('div',{className:'sec'},'Atraso e rescisão'),
    h('div',{className:'row r2'},
      h(Fld,{label:'Multa atraso (%)'},
        h('input',{value:f.multaAtraso, inputMode:'decimal', onChange:e=>setF({...f,multaAtraso:e.target.value})})),
      h(Fld,{label:'Juros/dia (%)'},

    h(Fld,{label:'Multa rescisória'},

    h('div',{className:'sec'},'Documentos e caução'),

      h('input',{value:f.linkContrato, placeholder:'https://drive.google.com/…',

/* ───────── REAJUSTE ───────── */
function FormReajuste(p) {
  const c0 = p.modal.dados;
  const c  = p.contratos.find(x=>x.id===c0.id) || c0;   // valor sempre atual
  const i = p.imoveis.find(x=>x.id===c.imovelId) || {};
  const atual = num(c.valorAluguel);
  const sug = num(p.cfg.igpmAcum);
  const [pc, setPc] = useState(sug ? String(sug).replace('.',',') : '');
  const [data, setData] = useState(c.proximoReajuste || hoje());
  const novo = atual * (1 + num(pc)/100);
  const [manual, setManual] = useState('');
  const valorFinal = manual ? num(manual) : novo;

  const ok = async () => {
    if (valorFinal <= 0) return p.tst('Valor inválido');
    const hist = (c.historicoReajustes||[]).concat([{
      data, percentual: manual ? (((valorFinal/atual)-1)*100).toFixed(2) : num(pc).toFixed(2),
      de: atual, para: valorFinal, indice: c.indice
    }]);
    await salvar(COL.contratos, c.id, {
      valorAluguel: valorFinal,
      proximoReajuste: addMeses(data, 12),
      historicoReajustes: hist
    });
    p.tst('Reajuste aplicado ✓'); p.fechar();
  };

  return h(Modal,{title:'Reajuste · '+(i.nome||''), onClose:p.fechar},
    p.cfg.igpmAcum
      ? h('div',{className:'alert a-info'},
          h('span',null,'📊'),
          h('div',null, h('b',null,'IGP-M acumulado: ', p.cfg.igpmAcum, '%'),
            p.cfg.igpmRef ? ` (ref. ${mesLabel(p.cfg.igpmRef)})` : '',
            h('div',null,'Sugestão — você pode negociar outro percentual.')))
      : h('div',{className:'alert a-warn'},
          h('span',null,'ℹ️'),
          h('div',null,'Cadastre o IGP-M acumulado em Configurações para ver a sugestão.')),

    h(Fld,{label:'Data do reajuste'},
      h('input',{type:'date', value:data, onChange:e=>setData(e.target.value)})),
    h(Fld,{label:'Percentual aplicado (%)'},
      h('input',{value:pc, inputMode:'decimal', autoFocus:true, placeholder:'4,50',
        onChange:e=>{setPc(e.target.value); setManual('');}})),

    h('div',{className:'card', style:{background:'var(--brand-l)', border:'1px solid #99f6e4'}},
      h('div',{style:{display:'flex', justifyContent:'space-between', alignItems:'center'}},
        h('div',null,
          h('div',{style:{fontSize:'12px', color:'var(--mut)'}},'Valor atual'),
          h('div',{style:{fontSize:'17px', fontWeight:700}}, brl(atual))),
        h('div',{style:{fontSize:'20px', color:'var(--brand)'}},'→'),
        h('div',{style:{textAlign:'right'}},
          h('div',{style:{fontSize:'12px', color:'var(--mut)'}},'Novo valor'),
          h('div',{style:{fontSize:'21px', fontWeight:800, color:'var(--brand)'}}, brl(valorFinal))))),

    h(Fld,{label:'Ou digite o valor final direto (arredondamento negociado)'},
      h('input',{value:manual, inputMode:'decimal', placeholder:'ex.: 950,00',
        onChange:e=>setManual(e.target.value)})),

    h('div',{style:{fontSize:'12px', color:'var(--mut)', marginBottom:'12px'}},
      '⚠️ Próximo reajuste será agendado automaticamente para ', dbr(addMeses(data,12)), '.'),

    h('button',{className:'btn b-pri b-full', onClick:ok},'Aplicar reajuste'));
}

/* ───────── CAUÇÃO ───────── */

    contratoId: d.contratoId, tipo: d.tipo||'saida',
    valor: d.valor||'', data: d.data||hoje(), motivo: d.motivo||''
  });
  const ok = async () => {
    if (num(f.valor) <= 0) return p.tst('Informe o valor');
    await salvar(COL.caucao, d.id, {...f, valor:num(f.valor)});
    p.tst('Registrado ✓');
    const c = p.contratos.find(x=>x.id===f.contratoId);
    p.abrir('verContrato', c);

    onClose:()=>p.abrir('verContrato', p.contratos.find(x=>x.id===f.contratoId))},

      h('select',{value:f.tipo, onChange:e=>setF({...f,tipo:e.target.value})},
        h('option',{value:'entrada'},'➕ Entrada (recebeu caução)'),
        h('option',{value:'saida'},'➖ Saída (usou / devolveu)'))),
    h('div',{className:'row r2'},
      h(Fld,{label:'Valor'},
        h('input',{value:f.valor, inputMode:'decimal', autoFocus:true,
          onChange:e=>setF({...f,valor:e.target.value})})),
      h(Fld,{label:'Data'},
        h('input',{type:'date', value:f.data, onChange:e=>setF({...f,data:e.target.value})}))),
    h(Fld,{label:'Motivo'},
      h('select',{value: MOTIVOS.includes(f.motivo)?f.motivo:'Outro',
        onChange:e=>setF({...f, motivo: e.target.value==='Outro'?'':e.target.value})},
        MOTIVOS.map(m=>h('option',{key:m},m)))),

      h('input',{value:f.motivo, placeholder:'ex.: pintura da sala — R$ 300',
        onChange:e=>setF({...f,motivo:e.target.value})})),
    h('button',{className:'btn b-pri b-full', onClick:ok},'Registrar'));

/* ───────── COBRANÇA ───────── */
function FormCobranca(p) {
  const d = p.modal.dados || {};
  const [f, setF] = useState({
    contratoId:d.contratoId||'', competencia:d.competencia||mesAtual(),
    vencimento:d.vencimento||'', aluguel:d.aluguel||'',
    iptu:d.iptu||'', agua:d.agua||'', luz:d.luz||'', outros:d.outros||'',
    obsOutros:d.obsOutros||'', desconto:d.desconto||''
  });
  const c = p.contratos.find(x=>x.id===f.contratoId);

  const pickContrato = id => {
    const ct = p.contratos.find(x=>x.id===id);
    if (!ct) return setF({...f, contratoId:id});
    const dia = String(ct.diaVencimento||10).padStart(2,'0');
    setF({...f, contratoId:id, aluguel:ct.valorAluguel,
      vencimento:`${f.competencia}-${dia}`});
  };

  const ok = async () => {
    if (!f.contratoId) return p.tst('Escolha o contrato');
    const ct = p.contratos.find(x=>x.id===f.contratoId);
    await salvar(COL.cobrancas, d.id, {
      contratoId:f.contratoId, imovelId:ct.imovelId, inquilinoId:ct.inquilinoId,
      competencia:f.competencia, vencimento:f.vencimento,
      aluguel:num(f.aluguel), iptu:num(f.iptu), agua:num(f.agua), luz:num(f.luz),
      outros:num(f.outros), obsOutros:f.obsOutros, desconto:num(f.desconto),
      multa:num(d.multa), juros:num(d.juros),
      status: d.status||'aberta',
      dataPagamento: d.dataPagamento||'', comprovante: d.comprovante||''
    });
    p.tst('Salvo ✓'); p.fechar();
  };
  const del = async () => {
    if (!confirm('Excluir cobrança?')) return;
    await remover(COL.cobrancas, d.id); p.tst('Excluída'); p.fechar();
  };

  const tot = num(f.aluguel)+num(f.iptu)+num(f.agua)+num(f.luz)+num(f.outros)-num(f.desconto);

  return h(Modal,{title: d.id?'Editar cobrança':'Nova cobrança', onClose:p.fechar},
    h(Fld,{label:'Contrato *'},
      h('select',{value:f.contratoId, onChange:e=>pickContrato(e.target.value)},
        h('option',{value:''},'— escolha —'),
        p.contratos.filter(x=>x.status==='vigente').map(x=>{
          const i = p.imoveis.find(y=>y.id===x.imovelId)||{};
          const q = p.inquilinos.find(y=>y.id===x.inquilinoId)||{};
          return h('option',{key:x.id, value:x.id}, `${i.nome} — ${q.nome}`);
        }))),
    h('div',{className:'row r2'},
      h(Fld,{label:'Competência'},
        h('input',{type:'month', value:f.competencia,
          onChange:e=>setF({...f, competencia:e.target.value})})),
      h(Fld,{label:'Vencimento'},
        h('input',{type:'date', value:f.vencimento, onChange:e=>setF({...f,vencimento:e.target.value})}))),
    h(Fld,{label:'Aluguel'},
      h('input',{value:f.aluguel, inputMode:'decimal', onChange:e=>setF({...f,aluguel:e.target.value})})),

    h('div',{className:'sec'},'Encargos deste mês'),
    h('div',{className:'row r3'},
      c && c.iptuPorConta==='inquilino' && h(Fld,{label:'IPTU'},
        h('input',{value:f.iptu, inputMode:'decimal', onChange:e=>setF({...f,iptu:e.target.value})})),
      c && c.aguaNoNomeDela && h(Fld,{label:'💧 Água'},
        h('input',{value:f.agua, inputMode:'decimal', onChange:e=>setF({...f,agua:e.target.value})})),
      c && c.luzNoNomeDela && h(Fld,{label:'💡 Luz'},
        h('input',{value:f.luz, inputMode:'decimal', onChange:e=>setF({...f,luz:e.target.value})}))),
    c && !c.aguaNoNomeDela && !c.luzNoNomeDela && c.iptuPorConta!=='inquilino' &&
      h('div',{style:{fontSize:'12.5px', color:'var(--mut)', marginBottom:'12px'}},
        'Este contrato não tem encargos a repassar (água, luz e IPTU no nome do inquilino).'),

    h('div',{className:'row r2'},
      h(Fld,{label:'Outros'},
        h('input',{value:f.outros, inputMode:'decimal', onChange:e=>setF({...f,outros:e.target.value})})),
      h(Fld,{label:'Desconto'},
        h('input',{value:f.desconto, inputMode:'decimal', onChange:e=>setF({...f,desconto:e.target.value})}))),
    num(f.outros)>0 && h(Fld,{label:'Descrição de "outros"'},
      h('input',{value:f.obsOutros, onChange:e=>setF({...f,obsOutros:e.target.value})})),

    h('div',{className:'card', style:{background:'var(--brand-l)', border:'1px solid #99f6e4',
      display:'flex', justifyContent:'space-between', alignItems:'center'}},
      h('span',{style:{fontWeight:650}},'Total'),
      h('span',{style:{fontSize:'20px', fontWeight:800, color:'var(--brand)'}}, brl(tot))),

    h('div',{className:'btns'},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:ok},'Salvar'),
      d.id && h('button',{className:'btn b-bad', onClick:del},'Excluir')));
}

function VerCobranca(p) {
  const c = p.modal.dados;
  const cAtual = p.cobrancas.find(x=>x.id===c.id) || c;
  const ct = p.contratos.find(x=>x.id===cAtual.contratoId) || {};
  const i  = p.imoveis.find(x=>x.id===cAtual.imovelId) || {};
  const q  = p.inquilinos.find(x=>x.id===cAtual.inquilinoId) || {};
  const st = statusCobranca(cAtual);
  const atrasoDias = Math.max(0, diasEntre(cAtual.vencimento, hoje()));
  const total = totalCobranca(cAtual);
  const cfg = p.cfg;

  const [pgto, setPgto] = useState(false);
  const [dp, setDp]     = useState(hoje());

  const temPix = !!cfg.pixChave;
  const payload = temPix ? pixPayload({
    chave: cfg.pixChave, nome: cfg.pixNome, cidade: cfg.pixCidade,
    valor: total, txid: (i.nome||'AL').replace(/\W/g,'').slice(0,10).toUpperCase() + (cAtual.competencia||'').replace('-','')
  }) : '';

  const aplicarJuros = async () => {
    if (atrasoDias <= 0) return p.tst('Não está em atraso');
    const base = num(cAtual.aluguel) + encargosDoMes(cAtual);
    const pm = ct.multaAtraso ?? cfg.multaAtraso ?? 2;
    const pj = ct.jurosDia  ?? cfg.jurosDia  ?? 0.033;
    const multa = base * (num(pm)/100);
    const juros = base * (num(pj)/100) * atrasoDias;
    await salvar(COL.cobrancas, cAtual.id, {
      multa: Math.round(multa*100)/100, juros: Math.round(juros*100)/100
    });
    p.tst(`Multa ${brl(multa)} + juros ${brl(juros)} ✓`);
  };
  const limparJuros = async () => {
    await salvar(COL.cobrancas, cAtual.id, { multa:0, juros:0 });
    p.tst('Zerado');
  };
  const baixar = async () => {
    await salvar(COL.cobrancas, cAtual.id, { status:'pago', dataPagamento: dp });
    p.tst('Pagamento registrado ✓'); p.fechar();
  };
  const estornar = async () => {
    await salvar(COL.cobrancas, cAtual.id, { status:'aberta', dataPagamento:'' });
    p.tst('Estornado');
  };

  const linhas = [];
  linhas.push(`*${i.nome||'Aluguel'}* — ${mesLabel(cAtual.competencia)}`);
  linhas.push('');
  linhas.push(`Aluguel: ${brl(num(cAtual.aluguel))}`);
  if (num(cAtual.iptu)>0)  linhas.push(`IPTU: ${brl(num(cAtual.iptu))}`);
  if (num(cAtual.agua)>0)  linhas.push(`Água: ${brl(num(cAtual.agua))}`);
  if (num(cAtual.luz)>0)   linhas.push(`Luz: ${brl(num(cAtual.luz))}`);
  if (num(cAtual.outros)>0) linhas.push(`${cAtual.obsOutros||'Outros'}: ${brl(num(cAtual.outros))}`);
  if (num(cAtual.multa)>0) linhas.push(`Multa por atraso: ${brl(num(cAtual.multa))}`);
  if (num(cAtual.juros)>0) linhas.push(`Juros (${atrasoDias} dias): ${brl(num(cAtual.juros))}`);
  if (num(cAtual.desconto)>0) linhas.push(`Desconto: -${brl(num(cAtual.desconto))}`);
  linhas.push('');
  linhas.push(`*Total: ${brl(total)}*`);
  linhas.push(`Vencimento: ${dbr(cAtual.vencimento)}`);
  if (temPix) {
    linhas.push('');
    linhas.push('Pix copia e cola:');
    linhas.push(payload);
    linhas.push('');
    linhas.push('_Após pagar, envie o comprovante aqui. Obrigada!_');
  }
  const msg = linhas.join('\n');
  const waUrl = q.telefone
    ? `https://wa.me/55${soDigitos(q.telefone)}?text=${encodeURIComponent(msg)}`
    : '';

  return h(Modal,{title: `${i.nome||'?'} · ${mesLabel(cAtual.competencia)}`, onClose:p.fechar},
    h('div',{style:{textAlign:'center', margin:'0 0 14px'}},
      h('div',{style:{fontSize:'32px', fontWeight:800, letterSpacing:'-1px'}}, brl(total)),
      h('span',{className:'chip '+st.c}, st.t)),

    h('div',{className:'card'},
      h(KV,{k:'Inquilino', v:q.nome||'—'}),
      h(KV,{k:'Vencimento', v:dbr(cAtual.vencimento)}),
      h(KV,{k:'Aluguel', v:brl(num(cAtual.aluguel))}),
      num(cAtual.iptu)>0 && h(KV,{k:'IPTU', v:brl(num(cAtual.iptu))}),
      num(cAtual.agua)>0 && h(KV,{k:'💧 Água', v:brl(num(cAtual.agua))}),
      num(cAtual.luz)>0  && h(KV,{k:'💡 Luz', v:brl(num(cAtual.luz))}),
      num(cAtual.outros)>0 && h(KV,{k:cAtual.obsOutros||'Outros', v:brl(num(cAtual.outros))}),
      num(cAtual.multa)>0 && h(KV,{k:'Multa', v:brl(num(cAtual.multa))}),
      num(cAtual.juros)>0 && h(KV,{k:`Juros (${atrasoDias}d)`, v:brl(num(cAtual.juros))}),
      num(cAtual.desconto)>0 && h(KV,{k:'Desconto', v:'−'+brl(num(cAtual.desconto))}),
      cAtual.status==='pago' && h(KV,{k:'Pago em', v:dbr(cAtual.dataPagamento)})),

    cAtual.status!=='pago' && atrasoDias>0 && h('div',{className:'btns', style:{marginTop:'10px'}},
      num(cAtual.multa)===0 && num(cAtual.juros)===0
        ? h('button',{className:'btn b-sec b-sm b-full', onClick:aplicarJuros},
            `⚡ Aplicar multa ${ct.multaAtraso ?? cfg.multaAtraso ?? 2}% + juros ${atrasoDias} dias`)
        : h('button',{className:'btn b-sec b-sm b-full', onClick:limparJuros},'↺ Remover multa e juros')),

    !temPix && h('div',{className:'alert a-warn', style:{marginTop:'12px'}},
      h('span',null,'⚠️'),
      h('div',null,'Chave PIX não cadastrada. Vá em ',h('b',null,'Config'),' para gerar o código de pagamento.')),

    temPix && h('div',null,
      h('div',{className:'sec'},'Código PIX (valor exato)'),
      h('div',{className:'pix'}, payload),
      h('button',{className:'btn b-sec b-full b-sm', style:{marginTop:'8px'},
        onClick:()=>{navigator.clipboard.writeText(payload); p.tst('Código PIX copiado');}},
        '📋 Copiar código PIX')),

    cAtual.status!=='pago' && h('div',{style:{marginTop:'14px'}},
      waUrl
        ? h('a',{href:waUrl, target:'_blank', className:'btn b-wa b-full',
            style:{textDecoration:'none', marginBottom:'8px'}},'💬 Enviar cobrança no WhatsApp')
        : h('div',{className:'alert a-warn'}, h('span',null,'⚠️'),
            h('div',null,'Inquilino sem WhatsApp cadastrado.')),
      h('button',{className:'btn b-sec b-full b-sm', style:{marginBottom:'8px'},
        onClick:()=>{navigator.clipboard.writeText(msg); p.tst('Mensagem copiada');}},
        '📋 Copiar mensagem completa')),

    h('div',{className:'hr'}),

    cAtual.status==='pago'
      ? h('div',{className:'btns'},
          h('button',{className:'btn b-sec', style:{flex:1}, onClick:()=>p.abrir('cobranca', cAtual)},'✏️ Editar'),
          h('button',{className:'btn b-bad', onClick:estornar},'↺ Estornar'))
      : !pgto
        ? h('div',{className:'btns'},
            h('button',{className:'btn b-ok', style:{flex:1}, onClick:()=>setPgto(true)},'✅ Dar baixa (recebi)'),
            h('button',{className:'btn b-sec', onClick:()=>p.abrir('cobranca', cAtual)},'✏️'))
        : h('div',{className:'card', style:{background:'var(--ok-l)', border:'1px solid #a7f3d0'}},
            h(Fld,{label:'Data do recebimento'},
              h('input',{type:'date', value:dp, onChange:e=>setDp(e.target.value)})),
            h('div',{className:'btns'},
              h('button',{className:'btn b-ok', style:{flex:1}, onClick:baixar},'Confirmar recebimento'),
              h('button',{className:'btn b-sec', onClick:()=>setPgto(false)},'Cancelar'))));
}

/* ───────── DESPESA ───────── */
function FormDespesa(p) {
  const d = p.modal.dados || {};
  const [f, setF] = useState({
    imovelId:d.imovelId||'', descricao:d.descricao||'', categoria:d.categoria||'Manutenção',
    valor:d.valor||'', data:d.data||hoje(), fornecedor:d.fornecedor||'', linkNota:d.linkNota||''
  });
  const ok = async () => {
    if (!f.descricao.trim()) return p.tst('Descreva a despesa');
    if (num(f.valor)<=0) return p.tst('Informe o valor');
    await salvar(COL.despesas, d.id, {...f, valor:num(f.valor)});
    p.tst('Salvo ✓'); p.fechar();
  };
  const del = async () => {
    if (!confirm('Excluir despesa?')) return;
    await remover(COL.despesas, d.id); p.tst('Excluída'); p.fechar();
  };
  const CATS = ['Manutenção','Reforma','Pintura','Hidráulica','Elétrica','IPTU','Água','Luz','Material','Mão de obra','Documentação','Outros'];
  return h(Modal,{title: d.id?'Editar despesa':'Nova despesa', onClose:p.fechar},
    h(Fld,{label:'Casa'},
      h('select',{value:f.imovelId, onChange:e=>setF({...f,imovelId:e.target.value})},
        h('option',{value:''},'— geral (sem casa) —'),
        p.imoveis.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    h(Fld,{label:'Descrição *'},
      h('input',{value:f.descricao, autoFocus:true, placeholder:'Troca do chuveiro',
        onChange:e=>setF({...f,descricao:e.target.value})})),
    h('div',{className:'row r2'},
      h(Fld,{label:'Valor *'},
        h('input',{value:f.valor, inputMode:'decimal', onChange:e=>setF({...f,valor:e.target.value})})),
      h(Fld,{label:'Data'},
        h('input',{type:'date', value:f.data, onChange:e=>setF({...f,data:e.target.value})}))),
    h('div',{className:'row r2'},
      h(Fld,{label:'Categoria'},
        h('select',{value:f.categoria, onChange:e=>setF({...f,categoria:e.target.value})},
          CATS.map(c=>h('option',{key:c},c)))),
      h(Fld,{label:'Fornecedor'},
        h('input',{value:f.fornecedor, onChange:e=>setF({...f,fornecedor:e.target.value})}))),
    h(Fld,{label:'Link da nota/foto do recibo'},
      h('input',{value:f.linkNota, placeholder:'https://…', onChange:e=>setF({...f,linkNota:e.target.value})})),
    h('div',{className:'btns'},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:ok},'Salvar'),
      d.id && h('button',{className:'btn b-bad', onClick:del},'Excluir')));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
