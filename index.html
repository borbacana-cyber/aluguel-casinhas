/* ───────── utils ───────── */
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = v => {
  if (v === '' || v == null) return 0;
  if (typeof v === 'number') return isNaN(v) ? 0 : v;   // já é número (veio do Firestore) — não mexer
  let s = String(v).trim().replace(/[R$\s]/g,'');
  if (s === '') return 0;
  const temV = s.includes(','), temP = s.includes('.');
  if (temV && temP)      s = s.replace(/\./g,'').replace(',','.');  // 1.250,50 → 1250.50
  else if (temV)         s = s.replace(',','.');                    // 900,50   → 900.50
  else if (temP) {
    // só ponto: milhar (1.250) ou decimal (912.5 / 0.033)?
    const p = s.split('.');
    const ehMilhar = p.length > 2 ||                    // 1.250.000
      (p[p.length-1].length === 3 &&                    // último grupo com 3 dígitos…
       p[0] !== '0' && p[0] !== '' &&                   // …mas milhar não começa com "0."
       !/^0\d*$/.test(p[0]));
    if (ehMilhar) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const hoje = () => new Date().toISOString().slice(0,10);
const dbr  = d => d ? d.split('-').reverse().join('/') : '—';
const mesAtual = () => new Date().toISOString().slice(0,7);
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mesLabel = ym => { if(!ym) return '—'; const [a,m]=ym.split('-'); return MESES[+m-1]+'/'+a; };
const addMeses = (ymd, n) => {
  const d = new Date(ymd+'T12:00:00'); d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
};
const diasEntre = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000);
const soDigitos = s => String(s||'').replace(/\D/g,'');
const fmtTel = t => { const d=soDigitos(t); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t||'—'; };
const fmtCPF = c => { const d=soDigitos(c); return d.length===11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : (c||'—'); };
const uid = () => Math.random().toString(36).slice(2,9);
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ───────── valor por extenso (pt-BR) ───────── */
function extensoAte999(n) {
  const U=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  if (n===0) return '';
  if (n===100) return 'cem';
  let s='';
  const c=Math.floor(n/100), r=n%100;
  if (c) s+=C[c];
  if (r) {
    if (s) s+=' e ';
    if (r<20) s+=U[r];
    else { s+=D[Math.floor(r/10)]; if (r%10) s+=' e '+U[r%10]; }
  }
  return s;
}
function valorExtenso(v) {
  v = Math.round(num(v)*100)/100;
  const int = Math.floor(v), cent = Math.round((v-int)*100);
  let s='';
  const milhoes=Math.floor(int/1000000), milhares=Math.floor((int%1000000)/1000), resto=int%1000;
  if (milhoes) s+= (milhoes===1?'um milhão':extensoAte999(milhoes)+' milhões');
  if (milhares) { if(s) s+=' e '; s+= (milhares===1?'um mil':extensoAte999(milhares)+' mil'); }
  if (resto)   { if(s) s+= (resto<100||resto%100===0?' e ':' ') ; s+=extensoAte999(resto); }
  if (!s) s='zero';
  if (/milhão$|milhões$/.test(s.trim())) s+=' de';
  s += int===1?' real':' reais';
  if (cent) s+=' e '+extensoAte999(cent)+(cent===1?' centavo':' centavos');
  return s;
}
const MESES_EXT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function dataExtenso(ymd) {
  if (!ymd) return '—';
  const [a,m,d]=ymd.split('-').map(Number);
  return (d===1?'1º':d)+' de '+MESES_EXT[m-1]+' de '+a;
}
const prazoExtenso = n => {
  const E={6:'Seis',12:'Doze',18:'Dezoito',24:'Vinte e quatro',30:'Trinta',36:'Trinta e seis',48:'Quarenta e oito',60:'Sessenta'};
  return E[n] || extensoAte999(n).replace(/^./,c=>c.toUpperCase());
};

/* ───────── PIX BR Code (EMV) ─────────
   Gera payload copia-e-cola estático com valor. */
function pixPayload({chave, nome, cidade, valor, txid}) {
  const f = (id, val) => id + String(val.length).padStart(2,'0') + val;
  const nm = semAcento(nome||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,25).trim() || 'RECEBEDOR';
  const cd = semAcento(cidade||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,15).trim() || 'BRASIL';
  const tx = semAcento(txid||'***').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,25) || '***';
  const mai = f('00','BR.GOV.BCB.PIX') + f('01', chave);
  let p = '';
  p += f('00','01');
  p += f('26', mai);
  p += f('52','0000');
  p += f('53','986');
  if (valor && Number(valor) > 0) p += f('54', Number(valor).toFixed(2));
  p += f('58','BR');
  p += f('59', nm);
  p += f('60', cd);
  p += f('62', f('05', tx));
  p += '6304';
  return p + crc16(p);
}
function crc16(str) {
  let crc = 0xFFFF;
  for (let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}

</style>`;

function gerarContratoHTML({cfg, imovel, inquilino, inquilino2, ct}) {
  const L = {
    nome: cfg.locNome||'________________', cpf: fmtCPF(cfg.locCpf), rg: cfg.locRg||'____',
    nac: cfg.locNac||'BRASILEIRA', ec: cfg.locEC||'____', prof: cfg.locProf||'____',
    end: cfg.locEnd||'________________'
  };
  const qual = iq => iq ? ({
    nome:(iq.nome||'').toUpperCase(), cpf:fmtCPF(iq.cpf), rg:iq.rg||'____',
    nac:(iq.nacionalidade||'BRASILEIRA').toUpperCase(),
    ec:(iq.estadoCivil||'____').toUpperCase(), prof:(iq.profissao||'____').toUpperCase()
  }) : null;
  const Q  = qual(inquilino);
  const Q2 = qual(inquilino2);
  const FI = (ct.caucaoTipo==='fiador' && inquilino && inquilino.fiadorNome) ? {
    nome:(inquilino.fiadorNome||'').toUpperCase(), cpf:fmtCPF(inquilino.fiadorCpf),
    rg:inquilino.fiadorRg||'____', nac:(inquilino.fiadorNac||'BRASILEIRA').toUpperCase(),
    ec:(inquilino.fiadorEC||'____').toUpperCase(), prof:(inquilino.fiadorProf||'____').toUpperCase(),
    end:inquilino.fiadorEnd||'____'
  } : null;
  const V   = num(ct.valorAluguel);
  const cau = num(ct.caucaoValor);
  const cidade = cfg.cidadeForo||'Sorocaba';
  const dtAssin = ct.dataAssinatura||hoje();
  const isentoApos = addMeses(ct.dataInicio, 12);
  const multa = ct.multaAtrasoContrato ?? 10;
  const jurosMes = ct.jurosMesContrato ?? 1;
  const dia = ct.diaVencimento||10;
  const pr = num(ct.proRataValor);
  const tiposCau = {dinheiro:'CAUÇÃO EM DINHEIRO', fiador:'FIADOR', seguro:'SEGURO-FIANÇA', sem:'SEM GARANTIA'};

  const fianca = ct.caucaoTipo==='dinheiro'
    ? `<p><b>TIPO:</b> CAUÇÃO EM DINHEIRO</p>
       <p><b>VALOR:</b> R$ ${cau.toLocaleString('pt-BR',{minimumFractionDigits:2})} (${valorExtenso(cau)}). O pagamento será feito através de PIX no CPF da LOCADORA, no dia ${dbr(ct.caucaoData||ct.dataInicio)}.</p>
       <p><b>EQUIVALENTE À:</b> ${ct.caucaoEquivalente||'02 (dois)'} aluguéis na época</p>`
    : FI
    ? `<p><b>TIPO:</b> FIADOR</p>
       <p><b>FIADOR(A):</b> Sr(a). ${FI.nome}</p>
       <p><b>CPF/MF nº:</b> ${FI.cpf} – <b>RG nº:</b> ${FI.rg} – <b>NACIONALIDADE:</b> ${FI.nac} – <b>ESTADO CIVIL:</b> ${FI.ec} – <b>PROFISSÃO:</b> ${FI.prof}</p>
       <p><b>ENDEREÇO:</b> ${FI.end.toUpperCase()}</p>`
    : `<p><b>TIPO:</b> ${tiposCau[ct.caucaoTipo]||'—'}</p>`;

  const iptuTxt = ct.iptuPorConta==='proprietario'
    ? `Já o valor do <b>IPTU</b>, está incluso no aluguel e será de responsabilidade da <b>LOCADORA</b>.`
    : `O valor do <b>IPTU</b> será de responsabilidade do <b>LOCATÁRIO</b>, repassado mensalmente junto ao aluguel.`;

  const cl8 = ct.caucaoTipo==='dinheiro' ? `
    <h3>CLAUSULA 8 – DAS GARANTIAS:</h3>
    <p><b>8.1</b> – Como garantia da presente locação, no ato da imissão da posse do imóvel é dado pelo LOCATÁRIO neste ato, a título de CAUÇÃO, o montante de <b>R$ ${cau.toLocaleString('pt-BR',{minimumFractionDigits:2})} (${valorExtenso(cau)})</b>, que deverá ser depositado ou aplicado em conta poupança pela LOCADORA e assim será corrigido em seu índice e devolvido no final da locação, podendo porém ser retido pela LOCADORA, diante do descumprimento em uma das cláusulas contratuais.</p>
    <p><b>Parágrafo único.</b> Ao término do contrato, tendo sido este concluído em conformidade, após a Vistoria de Saída, o valor de <b>R$ ${cau.toLocaleString('pt-BR',{minimumFractionDigits:2})} (${valorExtenso(cau)})</b>, referente à caução do imóvel locado, deverá ser devolvido integralmente pela LOCADORA ao LOCATÁRIO com reajuste pelo índice da poupança do período, num prazo de até 5 (cinco) dias úteis após a devolução do imóvel e comprovação de quitação de todas as despesas pertinentes ao LOCATÁRIO.</p>
    <p><b>8.2</b> – O valor da caução será usado em todas as hipóteses as quais se fizerem necessários recursos provenientes do LOCATÁRIO. Caso que, sendo aplicado, tal numerário imediatamente deverá ser reposto à LOCADORA pelo LOCATÁRIO, <b>não sendo de forma alguma possível o LOCATÁRIO utilizar este recurso para quitação dos últimos aluguéis em aberto.</b></p>`
  : FI ? `<h3>CLAUSULA 8 – DAS GARANTIAS:</h3>
    <p><b>8.1</b> – Como garantia da presente locação, assina o presente contrato na qualidade de <b>FIADOR(A)</b> e principal pagador(a), solidariamente responsável, Sr(a). <b>${FI.nome}</b>, ${FI.nac.toLowerCase()}, ${FI.ec.toLowerCase()}, ${FI.prof.toLowerCase()}, portador(a) do CPF/MF nº ${FI.cpf} e RG nº ${FI.rg}, residente e domiciliado(a) à ${FI.end}, que responde por todas as obrigações deste contrato, inclusive aluguéis, encargos, multas, reparos e acessórios, até a efetiva entrega das chaves, com renúncia expressa aos benefícios dos artigos 827 e 835 do Código Civil.</p>
    <p><b>8.2</b> – A responsabilidade do FIADOR permanece mesmo em caso de prorrogação do contrato por prazo indeterminado, nos termos do art. 39 da Lei 8.245/91.</p>`
  : `<h3>CLAUSULA 8 – DAS GARANTIAS:</h3>
    <p><b>8.1</b> – A presente locação é garantida na modalidade <b>${tiposCau[ct.caucaoTipo]||'—'}</b>, conforme identificado no Quadro Resumo, respondendo o garantidor solidariamente por todas as obrigações deste contrato até a efetiva entrega das chaves.</p>`;

  return `<!DOCTYPE html><html><head><meta charset="utf-8">${CSS_DOC}</head><body>
  <div class="no-print" style="background:#0f766e;color:#fff;padding:12px;text-align:center;font-family:sans-serif">
    Confira o documento e use <b>Imprimir → Salvar como PDF</b>. Depois suba no Autentique.
  </div>
  <h1>CONTRATO DE LOCAÇÃO DE IMÓVEL RESIDENCIAL</h1>
  <h2>QUADRO RESUMO</h2>
  <div class="qr">
    <p><b>LOCADORA:</b> Sra. ${L.nome.toUpperCase()}</p>
    <p><b>CPF/MF nº:</b> ${L.cpf} – <b>RG nº:</b> ${L.rg} – <b>NACIONALIDADE:</b> ${L.nac} – <b>ESTADO CIVIL:</b> ${L.ec} – <b>PROFISSÃO:</b> ${L.prof}</p>
    <p><b>ENDEREÇO:</b> ${L.end}</p>
    <br>
    <p><b>LOCATÁRIO${Q2?'S':''}:</b><br>Sr(a). ${Q.nome}</p>
    <p><b>CPF/MF nº:</b> ${Q.cpf} – <b>RG nº:</b> ${Q.rg} – <b>NACIONALIDADE:</b> ${Q.nac} – <b>ESTADO CIVIL:</b> ${Q.ec} – <b>PROFISSÃO:</b> ${Q.prof}</p>
    ${Q2?`<p>Sr(a). ${Q2.nome}</p>
    <p><b>CPF/MF nº:</b> ${Q2.cpf} – <b>RG nº:</b> ${Q2.rg} – <b>NACIONALIDADE:</b> ${Q2.nac} – <b>ESTADO CIVIL:</b> ${Q2.ec} – <b>PROFISSÃO:</b> ${Q2.prof}</p>`:''}
    <br>
    <p><b><u>FIANÇA LOCATÍCIA</u></b></p>
    ${fianca}
    <br>
    <p><b>IMÓVEL:</b> ${(imovel.descricao||imovel.tipo||'IMÓVEL RESIDENCIAL').toUpperCase()}</p>
    <p><b>ENDEREÇO:</b> ${(imovel.endereco||'').toUpperCase()}</p>
    <p><b>PRAZO DA LOCAÇÃO:</b> ${ct.prazoMeses} (${prazoExtenso(ct.prazoMeses)}) meses</p>
    <p><b>VALOR:</b> R$ ${V.toLocaleString('pt-BR',{minimumFractionDigits:2})} (${valorExtenso(V).toUpperCase()}) MENSAIS</p>
    <p><b>INICIO:</b> ${dataExtenso(ct.dataInicio).toUpperCase()}<br><b>TERMINO:</b> ${dataExtenso(ct.dataFim).toUpperCase()}</p>
    <p><b>DATA DE PAGAMENTO:</b> Até dia ${dia} do mês impreterivelmente.${pr>0?`<br>(1º pagamento até ${dbr(ct.proRataData)} REF. A ${ct.proRataDias||''} DIAS, no valor de R$ ${pr.toLocaleString('pt-BR',{minimumFractionDigits:2})}).`:''}</p>
  </div>

  <p style="margin-top:18px">Pelo presente instrumento particular de Contrato de Locação, as partes previamente qualificadas, tem entre si como justo e convencionado e que se obrigam a observar, por si e por seus herdeiros e sucessores, mediante as cláusulas e condições a seguir:</p>

  <h3>CLAUSULA 1 – OBJETO E PRAZO DO CONTRATO:</h3>
  <p><b>1.1</b> – A LOCADORA na qualidade de proprietária do imóvel descrito no quadro resumo, LOCA-O pelo prazo certo e ajustado de <b>${ct.prazoMeses} (${prazoExtenso(ct.prazoMeses).toLowerCase()}) meses</b>, contados da data de <b>${dataExtenso(ct.dataInicio)} e término em ${dataExtenso(ct.dataFim)}</b>, data em que o LOCATÁRIO se obriga a restituí-lo completamente desocupado, sob pena de incorrer na multa prevista na Cláusula 9 abaixo descrita;</p>

  <h3>CLAUSULA 2 – DO ALUGUEL E ENCARGOS:</h3>
  <p><b>2.1</b> – O valor do Aluguel mensal ora ajustado é de <b>R$ ${V.toLocaleString('pt-BR',{minimumFractionDigits:2})} (${valorExtenso(V)})</b>, com <b>vencimento dia ${dia} de cada mês</b>, devendo ser pago através de <b><i>Pix nº ${fmtCPF(cfg.pixChave)} (CPF) de titularidade da LOCADORA.</i></b></p>
  <p><b>2.2</b> – A não observância do prazo estabelecido na cláusula 2.1, implicará na incidência de multa de <b>${multa}% (${extensoAte999(multa)} por cento)</b> sobre o valor do aluguel, acrescido de juros de mora de <b>${jurosMes}% (${extensoAte999(jurosMes)} por cento)</b> ao mês ou fração corrigidos até o dia do efetivo pagamento;</p>
  <p><b>2.3</b> – Tudo o que for devido em razão deste contrato, cobrado judicialmente, o inadimplente, desde já concorda que arcará, além do principal e multa, mais juros moratórios de 1% (um por cento) ao mês e correção monetária, se houver; Honorários Advocatícios no valor de 30% (trinta por cento) sobre o valor do débito e mais as despesas de Oficiais de Justiça e demais despesas com custas processuais;</p>

  <h3>CLAUSULA 3 – DAS DESPESAS COM CONTAS DE CONSUMO:</h3>
  <p><b>3.1</b> – As despesas com energia elétrica, água e esgoto, gás, telefone e internet, serão de responsabilidade do <b>LOCATÁRIO</b>, qualquer que seja sua forma de cobrança, respondendo ainda o mesmo por eventuais aumentos destes valores, bem como multas, obrigando-se a apresentar à <b>LOCADORA</b>, todos os recibos correspondentes, devidamente quitados. ${iptuTxt}</p>
  <p><b>3.2</b> – Fica entendido que é de responsabilidade do LOCATÁRIO a busca, localização e transferência para seus nomes, das contas acima citadas, sendo que eventuais multas, correções, juros ou quaisquer outras despesas adicionais devidas pela inobservância dessas obrigações, serão de competência dos próprios LOCATÁRIOS, não podendo o mesmo alegar não ter efetuado os pagamentos por não haver recebido mencionadas cobranças a tempo;</p>
  <p><b>3.3</b> – O LOCATÁRIO declara estar ciente de que comprovantes de pagamento (recibos) não dão quitação aos débitos anteriores ou de outras obrigações estipuladas neste contrato, sendo certo que o LOCATÁRIO não tem qualquer responsabilidade sobre eventuais débitos anteriores à data deste contrato;</p>

  <h3>CLAUSULA 4 – DA RENOVAÇÃO E REAJUSTE:</h3>
  <p><b>4.1</b> – O valor do aluguel será reajustado anualmente, tomando-se por base o índice de variação do <b>${ct.indice||'INPC (Índice Nacional de Preços ao Consumidor)'}</b>, ou outro índice que vier a substituí-lo. Se no decorrer da locação a legislação vier a permitir reajustes em período inferiores a 12 (doze) meses, as partes convencionam a imediatamente aplicar ao presente contrato a nova sistemática pela periodicidade permitida, previamente acordado e na ausência do índice, voltam a conversar para que seja estipulado um novo dentro da legislação vigente;</p>

  <h3>CLAUSULA 5 – DO USO E DESTINAÇÃO DO IMOVEL:</h3>
  <p><b>5.1</b> – A presente locação destina-se exclusivamente para fins "RESIDENCIAIS" tendo o LOCATÁRIO, declarado que <b>residirá com mais ${ct.pessoas??0} pessoa(s)</b>, não podendo ser mudada sua destinação e uso, sem prévia autorização da LOCADORA.</p>
  <p><b>5.2</b> – Modificações, transformações ou mesmo acessões no imóvel locado sem prévia autorização por escrito da LOCADORA, igualmente são vedadas aos LOCATÁRIOS, assim como não poderá sublocar, emprestar ou arrendar a terceiros, no todo ou em parte e estará obrigado a denunciar a LOCADORA qualquer turbação ou esbulhos cometidos por terceiro no imóvel objeto desta locação.</p>
  <p><b>5.3</b> – O LOCATÁRIO é o único responsável pelas exigências dos poderes públicos a que der causa e nenhuma intimação desses órgãos de fiscalização poderá ser motivo para o LOCATÁRIO abandonar o imóvel ou pleitear rescisão de contrato, salvo se o prédio for interditado ou estiver com a construção ameaçando ruir, fatos a serem comprovados previamente mediante inspeção judicial.</p>
  ${ct.quintalCompartilhado?`<p><b>5.4</b> – O LOCATÁRIO declara que tem ciência e desde já é responsável por cumprir todas as exigências constantes nas <b>REGRAS DE CONVIVÊNCIA NO QUINTAL COMPARTILHADO</b>. Sendo responsável por multas, caso ocorra.</p>`:''}

  <h3>CLAUSULA 6 – DAS VISTORIAS E VISITAS:</h3>
  <p><b>6.1</b> – O LOCATÁRIO declara haver vistoriado o imóvel objeto desta locação, encontrando-o em perfeitas condições de habitabilidade, conservação e higiene, com todos os seus equipamentos funcionando perfeitamente, tudo conforme consta no Laudo de Vistoria Inicial (fotográfico), o qual assinado pelas partes passa a fazer parte integrante deste instrumento.</p>
  <p><b>6.2</b> – Ao LOCATÁRIO é concedido o prazo de 30 (trinta) dias da assinatura deste contrato, para informar a LOCADORA qualquer divergência que detectar entre Laudo de Vistoria e a real situação do imóvel.</p>
  <p><b>6.3</b> – A fim de fiscalizar a fiel execução deste contrato, o LOCATÁRIO permitirá que a <b>LOCADORA</b> vistorie o imóvel em horário pré-estabelecido.</p>
  <p><b>6.4</b> – As benfeitorias que sejam úteis, necessárias ou voluntárias e de acessão, que o LOCATÁRIO na vigência do contrato introduzir ao imóvel, a ele ficarão incorporadas, não lhe cabendo nenhuma indenização ou ressarcimento e nem direito de retenção e no caso de desapropriação do imóvel, o contrato será rescindido ficando a LOCADORA desobrigada de toda e qualquer responsabilidade pelas obrigações deste contrato, as quais passarão ao órgão expropriador, somente com quem poderá agir a LOCADORA.</p>
  <p><b>6.5</b> – O LOCATÁRIO obriga-se a conservar o imóvel como se fosse seu, devendo mantê-lo durante a locação nas mesmas condições que o vistoriou procedendo com todos os consertos e reparos, limpeza, pintura e manutenção necessárias e mais, obriga-se a restituí-lo ao término da locação e efetiva entrega das chaves, nas mesmas condições que o recebeu.</p>

  <h3>CLAUSULA 7 – DA ENTREGA DAS CHAVES NO TÉRMINO DA LOCAÇÃO:</h3>
  <p><b>7.1</b> – O recebimento das chaves do imóvel no final do contrato pelo LOCATÁRIO, somente será possível após a realização de vistoria no imóvel pela <b>LOCADORA</b>, ocasião em que será elaborado um Laudo de Vistoria de Saída, assinado por ambas as partes, vistoria essa que deverá ser requisitada pelo LOCATÁRIO com antecedência mínima de 30 (trinta) dias.</p>
  <p><b>7.2</b> – Se em confronto com a <b>Vistoria Inicial</b> forem constatados danos ou irregularidades nas dependências do imóvel ocasionada pelo LOCATÁRIO durante o período de locação, as chaves do mesmo não serão recebidas pela LOCADORA, estando desde já, o LOCATÁRIO obrigado a efetuar os reparos apontados na Vistoria de Saída, respondendo ainda pelos aluguéis e encargos enquanto não forem aceitas as chaves do imóvel. Os reparos a que estará obrigado poderão ser substituídos por indenização em dinheiro, desde que a LOCADORA esteja de acordo.</p>
  <p><b>7.3</b> – O Laudo de Vistoria Fotográfico anexo, faz parte integrante deste contrato e findada a locação, o imóvel deverá ser devolvido nas mesmas condições nele descritas, para tanto, obrigam-se a repararem as deteriorações decorrentes de seu uso normal, inclusive no que se refere à pintura, condições de higiene e limpeza, lixos, sujeiras ou entulhos.</p>

  ${cl8}

  <h3>CLAUSULA 9 – DA MULTA POR INFRAÇÃO:</h3>
  <p><b>9.1</b> – As partes resolvem estipular a multa equivalente a 03 (três) aluguéis na época, na qual incorrerá a parte que infringir qualquer cláusula deste contrato, ficando reservada à parte inocente a faculdade de considerar simultaneamente rescindida a locação, independentemente de qualquer formalidade.</p>
  <p><b>9.2</b> – Ao LOCATÁRIO é permitida a devolução do imóvel durante o prazo estipulado para duração do contrato, desde que arque com a multa aqui pactuada, calculada proporcionalmente ao tempo restante do contrato. Caso o LOCATÁRIO venha a desocupar o imóvel após os 12 (doze) primeiros meses de locação, ou seja, <b>após ${dbr(isentoApos)}</b>, serão isentos de multa contratual prevista nesta cláusula e o mesmo aplica-se à LOCADORA, caso venha requerer o imóvel, desde que avisem sua intenção conforme cláusula 7.1.</p>

  <h3>CLAUSULA 10 – DAS DISPOSIÇÕES FINAIS</h3>
  <p><b>10.1</b> – Sendo a presente locação regida pelas disposições da Lei nº 8.245/91 do inquilinato, aplicando-se no que couber o preceito do Código Civil Brasileiro que regem a matéria.</p>
  <p><b>10.2</b> – Deverá o LOCATÁRIO fazer chegar imediatamente às mãos da LOCADORA, todos os avisos de impostos, contas de consumo (energia) que lhe sejam entregues em nome da LOCADORA, ficando também o LOCATÁRIO responsável em transferir para seu nome junto às concessionárias as contas de energia elétrica e água e esgoto.</p>
  <p><b>10.3</b> – As Partes e as testemunhas envolvidas neste instrumento afirmam e declaram que esse poderá ser assinado eletronicamente através da plataforma "Autentique", atualmente no endereço https://www.autentique.com.br/, com fundamento no Artigo 10, parágrafo 2º da MP 2200-2/2001, e do Artigo 6º do Decreto 10.278/2020, sendo as assinaturas consideradas válidas, vinculantes e executáveis, desde que firmadas pelos representantes legais das Partes. Consigna-se no presente instrumento que a assinatura com Certificado Digital/eletrônica tem a mesma validade jurídica de um registro e autenticação feita em cartório, seja mediante utilização de certificados e-CPF, e-CNPJ e/ou e-mail. As Partes renunciam à possibilidade de exigir a troca, envio ou entrega das vias originais (não-eletrônicas) assinadas do instrumento, bem como renunciam ao direito de recusar ou contestar a validade das assinaturas eletrônicas, na medida máxima permitida pela legislação aplicável.</p>

  <h3>CLAUSULA 11 – DO FORO:</h3>
  <p><b>11.1</b> – Para dirimir as dúvidas ou questões oriundas deste contrato, as partes elegem o foro da Comarca de ${cidade}, com renúncia de qualquer outro, por mais privilegiado que lhes possa ser.</p>
  <p>E por estarem assim justas e contratadas, assinam eletronicamente o presente contrato, na presença da testemunha, para que surta seus legais e jurídicos efeitos.</p>
  <p style="margin-top:22px">${cidade}/SP, ${dataExtenso(dtAssin)}.</p>

  <div class="assin">
    <div class="box">LOCADORA</div>
    <div class="lin"><b>${L.nome.toUpperCase()}</b><br>CPF/MF nº: ${L.cpf} – RG nº: ${L.rg}</div>
    <div class="box">LOCATÁRIO${Q2?'S':''}</div>
    <div class="lin"><b>${Q.nome}</b><br>CPF/MF nº: ${Q.cpf} – RG nº: ${Q.rg}</div>
    ${Q2?`<div class="lin"><b>${Q2.nome}</b><br>CPF/MF nº: ${Q2.cpf} – RG nº: ${Q2.rg}</div>`:''}
    ${FI?`<div class="box">FIADOR(A)</div>
    <div class="lin"><b>${FI.nome}</b><br>CPF/MF nº: ${FI.cpf} – RG nº: ${FI.rg}</div>`:''}
    ${cfg.testNome?`<div class="box">TESTEMUNHA</div>
    <div class="lin"><b>${cfg.testNome.toUpperCase()}</b><br>CPF/MF nº: ${fmtCPF(cfg.testCpf)}</div>`:''}
  </div>
  </body></html>`;
}

function gerarLaudoHTML({cfg, imovel, inquilino, vist, fotos}) {
  const L = { nome:(cfg.locNome||'').toUpperCase(), cpf:fmtCPF(cfg.locCpf), rg:cfg.locRg||'____',
    nac:cfg.locNac||'BRASILEIRA', ec:cfg.locEC||'____', prof:cfg.locProf||'____', end:cfg.locEnd||'' };
  const Q = inquilino ? { nome:(inquilino.nome||'').toUpperCase(), cpf:fmtCPF(inquilino.cpf), rg:inquilino.rg||'____',
    nac:(inquilino.nacionalidade||'BRASILEIRA').toUpperCase(), ec:(inquilino.estadoCivil||'____').toUpperCase(),
    prof:(inquilino.profissao||'____').toUpperCase() } : null;
  const tipoTit = vist.tipo==='saida'?'TERMO DE VISTORIA DE SAÍDA DO IMÓVEL':vist.tipo==='periodica'?'TERMO DE VISTORIA PERIÓDICA DO IMÓVEL':'TERMO DE VISTORIA INICIAL DO IMÓVEL';
  const cidade = cfg.cidadeForo||'Sorocaba';

  const itensHTML = (vist.itens||[]).map((it,ix)=>{

/* ───────── Firestore hook ───────── */function useCol(name, ready) {
  const [data, setData] = useState([]);
  useEffect(() => {
    if (!ready) return;
    const { collection, onSnapshot } = window.__fs;
    const un = onSnapshot(collection(window.__db, name),
      s => setData(s.docs.map(d => ({ id: d.id, ...d.data() }))),
      e => console.error(name, e));
    return un;
  }, [name, ready]);
  return data;
}
const salvar = async (col, id, dados) => {
  try {
    const { addDoc, updateDoc, doc, collection } = window.__fs;
    if (id) await updateDoc(doc(window.__db, col, id), dados);
    else    await addDoc(collection(window.__db, col), dados);
  } catch(e) {
    console.error(e);
    alert('❌ Não foi possível gravar no banco.\n\nCausa provável: regras do Firestore não publicadas para "'+col+'" ou sem internet.\n\nDetalhe: '+(e.message||e));
    throw e;
  }
};
const remover = async (col, id) => {
  try {
    const { deleteDoc, doc } = window.__fs;
    await deleteDoc(doc(window.__db, col, id));
  } catch(e) {
    console.error(e);
    alert('❌ Não foi possível excluir (regras do Firestore?).\n'+(e.message||e));
    throw e;
  }
};

/* ───────── lógica de negócio ───────── */
function statusCobranca(c) {
  if (c.status === 'pago') return { t:'Pago', c:'c-ok' };
  const d = diasEntre(c.vencimento, hoje());
  if (d > 0)  return { t:`${d}d atrasado`, c:'c-bad' };
  if (d === 0) return { t:'Vence hoje', c:'c-warn' };
  if (d >= -5) return { t:`Vence em ${-d}d`, c:'c-warn' };
  return { t:'A vencer', c:'c-mut' };
}
function encargosDoMes(cob) {
  return num(cob.iptu) + num(cob.agua) + num(cob.luz) + num(cob.outros);
}
function totalCobranca(cob) {
  const base = num(cob.aluguel) + encargosDoMes(cob);
  const enc  = num(cob.multa) + num(cob.juros);
  return base + enc - num(cob.desconto);
}
function saldoCaucao(contratoId, movs) {
  return movs.filter(m => m.contratoId === contratoId)
             .reduce((s,m) => s + (m.tipo === 'entrada' ? num(m.valor) : -num(m.valor)), 0);
}

/* ══════════════════ PAINEL ══════════════════ */
function Painel(p) {
  const { contratos, imoveis, inquilinos, cobrancas, caucaoMov, abrir, setAba } = p;
  const vig = contratos.filter(c => c.status === 'vigente');
  const im  = id => imoveis.find(x=>x.id===id) || {};
  const iq  = id => inquilinos.find(x=>x.id===id) || {};

  const abertas   = cobrancas.filter(c => c.status !== 'pago');
  const atrasadas = abertas.filter(c => diasEntre(c.vencimento, hoje()) > 0);
  const receber   = abertas.reduce((s,c)=>s+totalCobranca(c),0);
  const atraso    = atrasadas.reduce((s,c)=>s+totalCobranca(c),0);
  const mensal    = vig.reduce((s,c)=>s+num(c.valorAluguel),0);

  const pagasMes = cobrancas.filter(c => c.status==='pago' && (c.dataPagamento||'').slice(0,7)===mesAtual());
  const recebido = pagasMes.reduce((s,c)=>s+totalCobranca(c),0);

  // reajustes próximos 60 dias
  const reaj = vig.filter(c => c.proximoReajuste && diasEntre(hoje(), c.proximoReajuste) <= 60)
                  .sort((a,b)=>a.proximoReajuste.localeCompare(b.proximoReajuste));
  // contratos vencendo em 90 dias
  const venc = vig.filter(c => c.dataFim && diasEntre(hoje(), c.dataFim) <= 90)
                  .sort((a,b)=>a.dataFim.localeCompare(b.dataFim));
  const vagas = imoveis.filter(i => !vig.find(c=>c.imovelId===i.id));

  return h('div',null,
    h('div',{className:'row r2', style:{marginBottom:'10px'}},
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--brand)'}}, brl(mensal)),
        h('div',{className:'l'},'Aluguel/mês')),
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--ok)'}}, brl(recebido)),
        h('div',{className:'l'},'Recebido este mês'))),
    h('div',{className:'row r2', style:{marginBottom:'14px'}},
      h('div',{className:'stat'}, h('div',{className:'n', style:{color: atraso>0?'var(--bad)':'var(--mut)'}}, brl(atraso)),
        h('div',{className:'l'},`Em atraso (${atrasadas.length})`)),
      h('div',{className:'stat'}, h('div',{className:'n'}, brl(receber)),
        h('div',{className:'l'},`A receber (${abertas.length})`))),

    atrasadas.length > 0 && h('div',{className:'alert a-bad'},
      h('span',null,'⚠️'),
      h('div',null, h('b',null,`${atrasadas.length} cobrança(s) em atraso`), ' — ',
        h('a',{href:'#', className:'lnk', onClick:e=>{e.preventDefault();setAba('cobrancas');}},'ver e cobrar'))),

    contratos.filter(c=>c.status==='aguardando').length > 0 && h('div',{className:'alert a-warn'},
      h('span',null,'⏳'),
      h('div',null, h('b',null,'Contrato aguardando assinatura'),
        contratos.filter(c=>c.status==='aguardando').map(c => h('div',{key:c.id, style:{marginTop:'3px'}},
          `${im(c.imovelId).nome||'?'} — ${iq(c.inquilinoId).nome||'?'} `,
          h('a',{href:'#', className:'lnk', onClick:e=>{e.preventDefault();abrir('verContrato',c);}},'abrir'))))),

    reaj.length > 0 && h('div',{className:'alert a-warn'},
      h('span',null,'📈'),
      h('div',null, h('b',null,'Reajuste chegando'),
        reaj.map(c => h('div',{key:c.id, style:{marginTop:'3px'}},
          `${im(c.imovelId).nome||'?'} — ${dbr(c.proximoReajuste)} `,
          h('a',{href:'#', className:'lnk', onClick:e=>{e.preventDefault();abrir('reajuste',c);}},'aplicar'))))),

    venc.length > 0 && h('div',{className:'alert a-info'},
      h('span',null,'📄'),
      h('div',null, h('b',null,'Contrato vencendo'),
        venc.map(c => h('div',{key:c.id, style:{marginTop:'3px'}},
          `${im(c.imovelId).nome||'?'} — ${dbr(c.dataFim)} (${diasEntre(hoje(),c.dataFim)} dias)`)))),

    vagas.length > 0 && h('div',{className:'alert a-warn'},
      h('span',null,'🔑'),
      h('div',null, h('b',null,`${vagas.length} casa(s) sem contrato vigente: `),
        vagas.map(v=>v.nome).join(', '))),

    h('div',{className:'sec'},'Casas alugadas'),
    vig.length === 0
      ? h(Empty,{i:'🏘️', t:'Nenhum contrato vigente', d:'Cadastre as casas e depois os contratos.'})
      : vig.slice().sort((a,b)=>(im(a.imovelId).nome||'').localeCompare(im(b.imovelId).nome||''))
          .map(c => {
        const i = im(c.imovelId), q = iq(c.inquilinoId);
        const ab = cobrancas.filter(x => x.contratoId===c.id && x.status!=='pago');
        const at = ab.filter(x => diasEntre(x.vencimento, hoje()) > 0);
        const sc = saldoCaucao(c.id, caucaoMov);
        return h('div',{key:c.id, className:'card clk', onClick:()=>abrir('verContrato', c)},
          h('div',{className:'ch'},
            h('div',null,
              h('div',{className:'ct'}, i.nome || '(sem casa)'),
              h('div',{className:'cs'}, q.nome || '(sem inquilino)', ' · venc. dia ', c.diaVencimento||'—')),
            at.length > 0
              ? h('span',{className:'chip c-bad'}, `${at.length} atraso`)
              : ab.length > 0
                ? h('span',{className:'chip c-warn'}, `${ab.length} aberta`)
                : h('span',{className:'chip c-ok'},'Em dia')),
          h('div',{style:{display:'flex',gap:'6px',marginTop:'9px',flexWrap:'wrap'}},
            h('span',{className:'chip c-brand'}, brl(num(c.valorAluguel))),
            sc > 0 && h('span',{className:'chip c-mut'}, '🔒 caução ', brl(sc)),
            c.proximoReajuste && h('span',{className:'chip c-mut'}, '📈 ', dbr(c.proximoReajuste))));
      }));
}

/* ══════════════════ COBRANÇAS ══════════════════ */
function Cobrancas(p) {
  const { cobrancas, contratos, imoveis, inquilinos, cfg, abrir, tst } = p;
  const [filtro, setFiltro] = useState('abertas');
  const [mesGer, setMesGer] = useState(mesAtual());
  const im = id => imoveis.find(x=>x.id===id) || {};
  const ct = id => contratos.find(x=>x.id===id) || {};
  const iq = id => inquilinos.find(x=>x.id===id) || {};

  const lista = useMemo(() => {
    let L = cobrancas.slice();
    if (filtro==='abertas')  L = L.filter(c=>c.status!=='pago');
    if (filtro==='atrasadas')L = L.filter(c=>c.status!=='pago' && diasEntre(c.vencimento,hoje())>0);
    if (filtro==='pagas')    L = L.filter(c=>c.status==='pago');
    if (filtro==='mes')      L = L.filter(c=>c.competencia===mesAtual());
    return L.sort((a,b)=> (a.vencimento||'').localeCompare(b.vencimento||''));
  }, [cobrancas, filtro]);

  const total = lista.reduce((s,c)=>s+totalCobranca(c),0);

  // cobranças abertas que ainda precisam de água/luz digitados
  const pendEncargo = cobrancas.filter(c => {
    if (c.status==='pago') return false;
    const t = ct(c.contratoId);
    return (t.aguaNoNomeDela && !num(c.agua)) || (t.luzNoNomeDela && !num(c.luz));
  });

  const gerarMes = async () => {
    const comp = mesGer;
    const vig = contratos.filter(c=>c.status==='vigente');
    if (!vig.length) return tst('Nenhum contrato vigente');
    let n = 0;
    for (const c of vig) {
      if (cobrancas.find(x=>x.contratoId===c.id && x.competencia===comp)) continue;
      const dia = String(c.diaVencimento||10).padStart(2,'0');
      await salvar(COL.cobrancas, null, {
        contratoId: c.id, imovelId: c.imovelId, inquilinoId: c.inquilinoId,
        competencia: comp, vencimento: `${comp}-${dia}`,
        aluguel: num(c.valorAluguel),
        iptu: 0, agua: 0, luz: 0, outros: 0, multa: 0, juros: 0, desconto: 0,
        status: 'aberta', criadoEm: new Date().toISOString()
      });
      n++;
    }
    tst(n ? `${n} cobrança(s) gerada(s) para ${mesLabel(comp)}` : `Todas já existem em ${mesLabel(comp)}`);
  };

  return h('div',null,
    h('div',{className:'card', style:{padding:'12px'}},
      h('label',null,'Gerar cobranças do mês'),
      h('div',{style:{display:'flex', gap:'8px'}},
        h('input',{type:'month', value:mesGer, onChange:e=>setMesGer(e.target.value),
          style:{flex:'0 0 145px'}}),
        h('button',{className:'btn b-pri', style:{flex:1}, onClick:gerarMes},'⚡ Gerar')),
      h('div',{style:{fontSize:'11.5px', color:'var(--mut)', marginTop:'7px'}},
        'Cria uma cobrança para cada contrato vigente. Não duplica se já existir.')),

    h('button',{className:'btn b-sec b-full b-sm', style:{marginBottom:'12px'},
      onClick:()=>abrir('cobranca')},'+ Cobrança avulsa'),

    pendEncargo.length > 0 && h('div',{className:'alert a-warn'},
      h('span',null,'💧'),
      h('div',null, h('b',null,`${pendEncargo.length} cobrança(s) sem água/luz preenchidos`),
        h('div',{style:{fontSize:'12px'}},
          'Esses contratos têm a conta no nome da proprietária. Abra a cobrança e digite o valor do mês antes de enviar.'))),

    h('div',{className:'pill-nav'},
      [['abertas','Abertas'],['atrasadas','Atrasadas'],['mes','Este mês'],['pagas','Pagas'],['todas','Todas']]
        .map(([k,l]) => h('button',{key:k, className:'pill'+(filtro===k?' on':''), onClick:()=>setFiltro(k)}, l))),

    lista.length > 0 && h('div',{className:'alert a-info'},
      h('span',null,'Σ'), h('div',null, h('b',null, lista.length, ' cobrança(s) · ', brl(total)))),

    lista.length === 0
      ? h(Empty,{i:'💰', t:'Nada aqui', d:'Use "Gerar" para criar as cobranças do mês.'})
      : lista.map(c => {
        const st = statusCobranca(c), i = im(c.imovelId), q = iq(c.inquilinoId);
        const t = ct(c.contratoId);
        const falta = c.status!=='pago' &&
          ((t.aguaNoNomeDela && !num(c.agua)) || (t.luzNoNomeDela && !num(c.luz)));
        return h('div',{key:c.id, className:'card clk', onClick:()=>abrir('verCobranca', c)},
          h('div',{className:'ch'},
            h('div',null,
              h('div',{className:'ct'}, i.nome||'?', ' · ', mesLabel(c.competencia)),
              h('div',{className:'cs'}, q.nome||'?', ' · vence ', dbr(c.vencimento))),
            h('div',{style:{textAlign:'right'}},
              h('div',{style:{fontWeight:800, fontSize:'15px'}}, brl(totalCobranca(c))),
              h('span',{className:'chip '+st.c, style:{marginTop:'3px'}}, st.t))),
          falta && h('div',{style:{marginTop:'7px'}},
            h('span',{className:'chip c-warn'},'💧 falta água/luz')));
      }));
}

/* ══════════════════ DESPESAS ══════════════════ */
function Despesas(p) {
  const { despesas, imoveis, cobrancas, contratos, abrir } = p;
  const [mes, setMes] = useState(mesAtual());
  const im = id => imoveis.find(x=>x.id===id) || {};
  const L = despesas.filter(d => (d.data||'').slice(0,7)===mes)
                    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const tot = L.reduce((s,d)=>s+num(d.valor),0);
  const rec = cobrancas.filter(c=>c.status==='pago' && (c.dataPagamento||'').slice(0,7)===mes)
                       .reduce((s,c)=>s+totalCobranca(c),0);

  // rentabilidade por casa (12 meses)
  const ini = addMeses(hoje(), -12).slice(0,7);
  const porCasa = imoveis.map(i => {
    const r = cobrancas.filter(c=>c.imovelId===i.id && c.status==='pago' && (c.dataPagamento||'')>=ini)
                       .reduce((s,c)=>s+totalCobranca(c),0);
    const d = despesas.filter(x=>x.imovelId===i.id && (x.data||'')>=ini)
                      .reduce((s,x)=>s+num(x.valor),0);
    return { ...i, rec:r, desp:d, liq:r-d };
  }).sort((a,b)=>b.liq-a.liq);

  return h('div',null,
    h('div',{className:'btns', style:{marginBottom:'12px'}},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:()=>abrir('despesa')},'+ Nova despesa'),
      h('input',{type:'month', value:mes, onChange:e=>setMes(e.target.value), style:{maxWidth:'150px'}})),

    h('div',{className:'row r3', style:{marginBottom:'14px'}},
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--ok)', fontSize:'15px'}}, brl(rec)),
        h('div',{className:'l'},'Recebido')),
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--bad)', fontSize:'15px'}}, brl(tot)),
        h('div',{className:'l'},'Gasto')),
      h('div',{className:'stat'}, h('div',{className:'n', style:{color:'var(--brand)', fontSize:'15px'}}, brl(rec-tot)),
        h('div',{className:'l'},'Líquido'))),

    h('div',{className:'sec'},'Despesas de ', mesLabel(mes)),
    L.length===0
      ? h('div',{className:'card', style:{textAlign:'center', color:'var(--mut)', fontSize:'13px'}},
          'Nenhuma despesa neste mês.')
      : L.map(d => h('div',{key:d.id, className:'card clk', onClick:()=>abrir('despesa', d)},
          h('div',{className:'ch'},
            h('div',null,
              h('div',{className:'ct', style:{fontSize:'14px'}}, d.descricao),
              h('div',{className:'cs'}, im(d.imovelId).nome||'Geral',' · ',dbr(d.data),
                d.categoria ? ' · '+d.categoria : '')),
            h('div',{style:{fontWeight:800, color:'var(--bad)'}}, brl(num(d.valor)))))),

    h('div',{className:'sec'},'Rentabilidade · últimos 12 meses'),
    porCasa.length===0
      ? h('div',{className:'card', style:{textAlign:'center', color:'var(--mut)', fontSize:'13px'}},'—')
      : h('div',{className:'card'},
          porCasa.map(c => h('div',{key:c.id, className:'kv'},
            h('span',{className:'k'}, c.nome),
            h('span',{className:'v', style:{color: c.liq>=0?'var(--ok)':'var(--bad)'}},
              brl(c.liq),
              h('div',{style:{fontSize:'11px', fontWeight:400, color:'var(--mut)'}},
                brl(c.rec),' − ',brl(c.desp)))))));
}

/* ───────── IMÓVEL ───────── */
function FormImovel(p) {
  const d = p.modal.dados || {};
  const [f, setF] = useState({
    nome: d.nome||'', endereco: d.endereco||'', tipo: d.tipo||'Casa',
    descricao: d.descricao||'',
    quartos: d.quartos||'', banheiros: d.banheiros||'', area: d.area||'',
    temSala: d.temSala??true, temCozinha: d.temCozinha??true,
    temLavanderia: d.temLavanderia??true, temQuintal: d.temQuintal??false,
    temGaragem: d.temGaragem??false, sobrado: d.sobrado??false,
    medidorAgua: d.medidorAgua||'', medidorLuz: d.medidorLuz||'',
    inscricaoIPTU: d.inscricaoIPTU||'', linkFotos: d.linkFotos||'', obs: d.obs||''
  });
  const montarDescricao = st => {
    const pt = [];
    const nq = parseInt(st.quartos)||0, nb = parseInt(st.banheiros)||0;
    if (nq) pt.push(nq+(nq>1?' QUARTOS':' QUARTO'));
    if (st.temSala) pt.push('SALA');
    if (st.temCozinha) pt.push('COZINHA');
    if (nb) pt.push(nb+(nb>1?' BANHEIROS':' BANHEIRO'));
    if (st.temLavanderia) pt.push('LAVANDERIA');
    if (st.temQuintal) pt.push('QUINTAL');
    if (st.temGaragem) pt.push('GARAGEM');
    const base = st.sobrado?'SOBRADO RESIDENCIAL':(st.tipo||'CASA').toUpperCase()+' RESIDENCIAL';
    return base+(pt.length?' COM '+pt.join(', ').replace(/, ([^,]+)$/,' E $1'):'');
  };
  const ok = async () => {
    if (!f.nome.trim()) return p.tst('Dê um nome/apelido à casa');
    await salvar(COL.imoveis, d.id, f);
    p.tst(d.id?'Casa atualizada ✓':'Casa cadastrada ✓'); p.fechar();
  };
  const del = async () => {
    if (!confirm(`Excluir "${d.nome}"? Contratos e cobranças NÃO serão apagados.`)) return;
    await remover(COL.imoveis, d.id); p.tst('Excluída'); p.fechar();
  };
  const cb = (campo, label) => h('label',{className:'sw'},
    h('input',{type:'checkbox', checked:f[campo], onChange:e=>setF({...f,[campo]:e.target.checked})}),
    h('span',null,label));
  return h(Modal,{title: d.id?'Editar casa':'Nova casa', onClose:p.fechar},
    h(Fld,{label:'Nome / apelido *'},
      h('input',{value:f.nome, placeholder:'Casa 1 — Fundos', autoFocus:true,
        onChange:e=>setF({...f,nome:e.target.value})})),
    h(Fld,{label:'Endereço completo'},
      h('input',{value:f.endereco, placeholder:'Rua X, 100 — Bairro — Cidade/SP — CEP',
        onChange:e=>setF({...f,endereco:e.target.value})})),
    h('div',{className:'sec'},'Cômodos (montam a descrição do contrato)'),
    h('div',{className:'row r3'},
      h(Fld,{label:'Tipo'},
        h('select',{value:f.tipo, onChange:e=>setF({...f,tipo:e.target.value})},
          ['Casa','Kitnet','Apartamento','Barracão','Salão'].map(x=>h('option',{key:x},x)))),
      h(Fld,{label:'Quartos'},
        h('input',{value:f.quartos, inputMode:'numeric', onChange:e=>setF({...f,quartos:e.target.value})})),
      h(Fld,{label:'Banheiros'},
        h('input',{value:f.banheiros, inputMode:'numeric', onChange:e=>setF({...f,banheiros:e.target.value})}))),
    h('div',{className:'card', style:{background:'#fafbfc', padding:'6px 12px', marginBottom:'13px'}},
      cb('temSala','Sala'), cb('temCozinha','Cozinha'), cb('temLavanderia','Lavanderia'),
      cb('temQuintal','Quintal'), cb('temGaragem','Garagem'), cb('sobrado','É sobrado (2 andares)')),
    h(Fld,{label:'Descrição para contrato'},
      h('input',{value:f.descricao||'', placeholder:'SOBRADO RESIDENCIAL COM 2 QUARTOS, SALA, COZINHA...',
        onChange:e=>setF({...f,descricao:e.target.value})})),
    h('button',{className:'btn b-sec b-sm b-full', style:{marginBottom:'13px'},
      onClick:()=>setF(st=>({...st, descricao:montarDescricao(st)}))},
      '⚡ Montar descrição pelos cômodos acima'),
    h('div',{className:'row r2'},
      h(Fld,{label:'Área (m²)'},
        h('input',{value:f.area, inputMode:'decimal', onChange:e=>setF({...f,area:e.target.value})})),
      h(Fld,{label:'Inscrição IPTU'},
        h('input',{value:f.inscricaoIPTU, onChange:e=>setF({...f,inscricaoIPTU:e.target.value})}))),
    h('div',{className:'row r2'},
      h(Fld,{label:'Medidor água'},
        h('input',{value:f.medidorAgua, onChange:e=>setF({...f,medidorAgua:e.target.value})})),
      h(Fld,{label:'Medidor luz'},
        h('input',{value:f.medidorLuz, onChange:e=>setF({...f,medidorLuz:e.target.value})}))),
    h(Fld,{label:'Link das fotos (Google Fotos / Drive)'},
      h('input',{value:f.linkFotos, placeholder:'https://…', onChange:e=>setF({...f,linkFotos:e.target.value})})),
    h(Fld,{label:'Observações'},
      h('textarea',{value:f.obs, onChange:e=>setF({...f,obs:e.target.value})})),
    h('div',{className:'btns'},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:ok},'Salvar'),
      d.id && h('button',{className:'btn b-bad', onClick:del},'Excluir')));
}

function VerImovel(p) {
  const i0 = p.modal.dados;
  const i  = p.imoveis.find(x=>x.id===i0.id) || i0;   // versão viva
  const c = p.contratos.find(x=>x.imovelId===i.id && x.status==='vigente');
  const q = c ? p.inquilinos.find(x=>x.id===c.inquilinoId) : null;
  const vist = p.vistorias.filter(v=>v.imovelId===i.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const desp = p.despesas.filter(d=>d.imovelId===i.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const totD = desp.reduce((s,d)=>s+num(d.valor),0);

  return h(Modal,{title:i.nome, onClose:p.fechar},
    h('div',{className:'card', style:{marginBottom:'12px'}},
      h(KV,{k:'Situação', chip: c?{t:'Alugada', c:'c-ok'}:{t:'Vaga', c:'c-warn'}}),
      h(KV,{k:'Endereço', v:i.endereco||'—'}),
      h(KV,{k:'Tipo', v:`${i.tipo||'—'}${i.quartos?' · '+i.quartos+' qto':''}${i.area?' · '+i.area+' m²':''}`}),
      i.medidorAgua && h(KV,{k:'Medidor água', v:i.medidorAgua}),

function FormContrato(p) {
  const d = p.modal.dados || {};
  const [f, setF] = useState({
    imovelId:d.imovelId||'', inquilinoId:d.inquilinoId||'',
    dataInicio:d.dataInicio||hoje(), prazoMeses:d.prazoMeses||30,
    dataFim:d.dataFim||addMeses(hoje(),30),
    diaVencimento:d.diaVencimento||10, valorAluguel:d.valorAluguel||'',
    indice:d.indice||'IGP-M',
    proximoReajuste:d.proximoReajuste||addMeses(hoje(),12),
    iptuPorConta:d.iptuPorConta||'inquilino',
    aguaNoNomeDela: d.aguaNoNomeDela ?? false,
    luzNoNomeDela:  d.luzNoNomeDela ?? false,
    multaAtraso:d.multaAtraso ?? (p.cfg.multaAtraso ?? 2),
    jurosDia:d.jurosDia ?? (p.cfg.jurosDia ?? 0.033),
    multaRescisoria:d.multaRescisoria||'3 aluguéis proporcionais',
    linkContrato:d.linkContrato||'',
    caucaoValor:d.caucaoValor||'', caucaoData:d.caucaoData||hoje(),
    status:d.status||'vigente', obs:d.obs||''
  });

  const setPrazo = v => {
    const n = parseInt(v)||0;
    setF(x => ({...x, prazoMeses:v, dataFim: n>0 ? addMeses(x.dataInicio, n) : x.dataFim }));
  };
  const setInicio = v => {
    const n = parseInt(f.prazoMeses)||0;
    setF(x => ({...x, dataInicio:v, dataFim: n>0?addMeses(v,n):x.dataFim,
      proximoReajuste: addMeses(v,12) }));
  };

  const ok = async () => {
    if (!f.imovelId)    return p.tst('Escolha a casa');
    if (!f.inquilinoId) return p.tst('Escolha o inquilino');
    if (num(f.valorAluguel) <= 0) return p.tst('Informe o valor do aluguel');
    const dados = {
      ...f, valorAluguel:num(f.valorAluguel), diaVencimento:parseInt(f.diaVencimento)||10,
      prazoMeses:parseInt(f.prazoMeses)||0,
      multaAtraso:num(f.multaAtraso), jurosDia:num(f.jurosDia)
    };
    delete dados.caucaoValor; delete dados.caucaoData;
    const novo = !d.id;
    const { addDoc, updateDoc, doc, collection } = window.__fs;
    let cid = d.id;
    if (novo) {
      const r = await addDoc(collection(window.__db, COL.contratos), dados);
      cid = r.id;
    } else {
      await updateDoc(doc(window.__db, COL.contratos, d.id), dados);
    }
    if (novo && num(f.caucaoValor) > 0) {
      await salvar(COL.caucao, null, {
        contratoId: cid, tipo:'entrada', valor:num(f.caucaoValor),
        data: f.caucaoData, motivo:'Caução recebida na assinatura'
      });
    }
    p.tst(novo?'Contrato criado ✓':'Contrato atualizado ✓'); p.fechar();
  };
  const del = async () => {
    if (!confirm('Excluir este contrato? As cobranças NÃO serão apagadas.')) return;
    await remover(COL.contratos, d.id); p.tst('Excluído'); p.fechar();
  };

  return h(Modal,{title: d.id?'Editar contrato':'Novo contrato', onClose:p.fechar},
    h(Fld,{label:'Casa *'},
      h('select',{value:f.imovelId, onChange:e=>setF({...f,imovelId:e.target.value})},
        h('option',{value:''},'— escolha —'),
        p.imoveis.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    h(Fld,{label:'Inquilino *'},
      h('select',{value:f.inquilinoId, onChange:e=>setF({...f,inquilinoId:e.target.value})},
        h('option',{value:''},'— escolha —'),
        p.inquilinos.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    p.inquilinos.length===0 && h('div',{className:'alert a-warn'},
      h('span',null,'⚠️'),
      h('div',null,'Nenhum inquilino cadastrado. ',
        h('a',{href:'#', className:'lnk', onClick:e=>{e.preventDefault();p.abrir('inquilino');}},'Cadastrar agora'))),

    h('div',{className:'row r3'},
      h(Fld,{label:'Início'}, h('input',{type:'date', value:f.dataInicio, onChange:e=>setInicio(e.target.value)})),
      h(Fld,{label:'Prazo (meses)'}, h('input',{value:f.prazoMeses, inputMode:'numeric', onChange:e=>setPrazo(e.target.value)})),
      h(Fld,{label:'Fim'}, h('input',{type:'date', value:f.dataFim, onChange:e=>setF({...f,dataFim:e.target.value})}))),

    h('div',{className:'row r2'},
      h(Fld,{label:'Valor do aluguel *'},
        h('input',{value:f.valorAluguel, inputMode:'decimal', placeholder:'900,00',
          onChange:e=>setF({...f,valorAluguel:e.target.value})})),
      h(Fld,{label:'Dia de vencimento'},
        h('input',{value:f.diaVencimento, inputMode:'numeric',
          onChange:e=>setF({...f,diaVencimento:e.target.value})}))),

    h('div',{className:'row r2'},
      h(Fld,{label:'Índice de reajuste'},
        h('select',{value:f.indice, onChange:e=>setF({...f,indice:e.target.value})},
          ['IGP-M','IPCA','INCC','Livre / negociado'].map(x=>h('option',{key:x},x)))),
      h(Fld,{label:'Próximo reajuste'},
        h('input',{type:'date', value:f.proximoReajuste,
          onChange:e=>setF({...f,proximoReajuste:e.target.value})}))),

    h('div',{className:'sec'},'Encargos'),
    h(Fld,{label:'IPTU por conta de'},
      h('select',{value:f.iptuPorConta, onChange:e=>setF({...f,iptuPorConta:e.target.value})},
        h('option',{value:'inquilino'},'Inquilino (repassar na cobrança)'),
        h('option',{value:'proprietario'},'Proprietária (não cobrar)'))),
    h('div',{className:'card', style:{background:'#fafbfc', padding:'6px 12px'}},
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.aguaNoNomeDela,
          onChange:e=>setF({...f,aguaNoNomeDela:e.target.checked})}),
        h('span',null,'💧 Conta de água no nome da proprietária ',
          h('span',{style:{color:'var(--mut)', fontSize:'12px'}},'(será cobrada junto)'))),
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.luzNoNomeDela,
          onChange:e=>setF({...f,luzNoNomeDela:e.target.checked})}),
        h('span',null,'💡 Conta de luz no nome da proprietária ',
          h('span',{style:{color:'var(--mut)', fontSize:'12px'}},'(será cobrada junto)')))),

    h('div',{className:'sec'},'Atraso e rescisão'),
    h('div',{className:'row r2'},
      h(Fld,{label:'Multa atraso (%)'},
        h('input',{value:f.multaAtraso, inputMode:'decimal', onChange:e=>setF({...f,multaAtraso:e.target.value})})),
      h(Fld,{label:'Juros/dia (%)'},
        h('input',{value:f.jurosDia, inputMode:'decimal', onChange:e=>setF({...f,jurosDia:e.target.value})}))),
    h(Fld,{label:'Multa rescisória'},
      h('input',{value:f.multaRescisoria, onChange:e=>setF({...f,multaRescisoria:e.target.value})})),

    h('div',{className:'sec'},'Documentos e caução'),
    h(Fld,{label:'Link do contrato em PDF (Drive)'},
      h('input',{value:f.linkContrato, placeholder:'https://drive.google.com/…',
        onChange:e=>setF({...f,linkContrato:e.target.value})})),
    !d.id && h('div',{className:'row r2'},
      h(Fld,{label:'Caução recebida (R$)'},
        h('input',{value:f.caucaoValor, inputMode:'decimal', placeholder:'900,00',
          onChange:e=>setF({...f,caucaoValor:e.target.value})})),
      h(Fld,{label:'Data'},
        h('input',{type:'date', value:f.caucaoData, onChange:e=>setF({...f,caucaoData:e.target.value})}))),

    h(Fld,{label:'Status'},
      h('select',{value:f.status, onChange:e=>setF({...f,status:e.target.value})},
        h('option',{value:'vigente'},'Vigente'),
        h('option',{value:'encerrado'},'Encerrado'))),
    h(Fld,{label:'Observações'},
      h('textarea',{value:f.obs, onChange:e=>setF({...f,obs:e.target.value})})),

    h('div',{className:'btns'},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:ok},'Salvar'),
      d.id && h('button',{className:'btn b-bad', onClick:del},'Excluir')));
}

function VerContrato(p) {
  const c0 = p.modal.dados;
  const c  = p.contratos.find(x=>x.id===c0.id) || c0;   // sempre a versão viva do Firestore
  const i = p.imoveis.find(x=>x.id===c.imovelId) || {};
  const q = p.inquilinos.find(x=>x.id===c.inquilinoId) || {};
  const q2 = p.inquilinos.find(x=>x.id===c.inquilinoId2);
  const [linkAss, setLinkAss] = useState('');
  const [ativando, setAtivando] = useState(false);

  const regerarPDF = () => {
    const html = gerarContratoHTML({cfg:p.cfg, imovel:i, inquilino:q, inquilino2:q2, ct:c});
    abrirImpressao(html, `Contrato ${i.nome} - ${q.nome}`);
  };
  const ativar = async () => {
    await salvar(COL.contratos, c.id, { status:'vigente', linkContrato: linkAss||c.linkContrato||'' });
    if (c.caucaoTipo==='dinheiro' && num(c.caucaoValor)>0 &&
        !p.caucaoMov.find(m=>m.contratoId===c.id && m.tipo==='entrada')) {
      await salvar(COL.caucao, null, {
        contratoId:c.id, tipo:'entrada', valor:num(c.caucaoValor),
        data:c.caucaoData||hoje(), motivo:'Caução recebida na assinatura'
      });
    }
    p.tst('Contrato ativado ✓ — cobranças liberadas');
    setAtivando(false);
  };
  const movs = p.caucaoMov.filter(m=>m.contratoId===c.id)
                          .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const saldo = saldoCaucao(c.id, p.caucaoMov);
  const entrada = movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+num(m.valor),0);
  const cobs = p.cobrancas.filter(x=>x.contratoId===c.id)
                          .sort((a,b)=>(b.competencia||'').localeCompare(a.competencia||''));
  const abertas = cobs.filter(x=>x.status!=='pago');
  const hist = c.historicoReajustes || [];

  return h(Modal,{title: i.nome||'Contrato', onClose:p.fechar},
    c.status==='aguardando' && h('div',null,
      h('div',{className:'alert a-warn'},
        h('span',null,'⏳'),
        h('div',null, h('b',null,'Aguardando assinatura no Autentique.'),
          h('div',{style:{fontSize:'12px'}},'Cobranças só serão geradas depois de ativar.'))),
      h('div',{className:'btns', style:{marginBottom:'12px'}},
        h('button',{className:'btn b-sec b-sm', style:{flex:1}, onClick:regerarPDF},'🖨️ Gerar PDF novamente'),
        h('button',{className:'btn b-sec b-sm', onClick:()=>p.abrir('gerarContrato', c)},'✏️ Editar dados')),
      !ativando
        ? h('button',{className:'btn b-ok b-full', style:{marginBottom:'14px'},
            onClick:()=>setAtivando(true)},'✅ Contrato assinado — ativar')
        : h('div',{className:'card', style:{background:'var(--ok-l)', border:'1px solid #a7f3d0', marginBottom:'14px'}},
            h(Fld,{label:'Link do PDF assinado (Autentique/Drive)'},
              h('input',{value:linkAss, placeholder:'https://valida.ae/… ou Drive', autoFocus:true,
                onChange:e=>setLinkAss(e.target.value)})),
            h('div',{style:{fontSize:'12px', color:'var(--mut)', marginBottom:'10px'}},
              c.caucaoTipo==='dinheiro' && num(c.caucaoValor)>0
                ? `Ao ativar, a caução de ${brl(num(c.caucaoValor))} será lançada automaticamente.`
                : 'Ao ativar, as cobranças mensais passam a ser geradas.'),
            h('div',{className:'btns'},
              h('button',{className:'btn b-ok', style:{flex:1}, onClick:ativar},'Confirmar ativação'),
              h('button',{className:'btn b-sec', onClick:()=>setAtivando(false)},'Cancelar')))),
    c.status==='vigente' && h('div',{className:'btns', style:{marginBottom:'12px'}},
      h('button',{className:'btn b-sec b-sm b-full', onClick:regerarPDF},'🖨️ Reimprimir contrato (PDF)'),
      h('button',{className:'btn b-sec b-sm b-full', onClick:()=>p.abrir('multaRescisoria', c)},'⚖️ Multa saída antecipada')),
    h('div',{className:'card'},
      h(KV,{k:'Status', chip: c.status==='vigente'?{t:'Vigente',c:'c-ok'}: c.status==='aguardando'?{t:'⏳ Aguardando assinatura',c:'c-warn'}:{t:'Encerrado',c:'c-mut'}}),
      h(KV,{k:'Inquilino', v:q.nome||'—'}),
      q2 && h(KV,{k:'2º locatário', v:q2.nome}),

/* ───────── GERAR CONTRATO (fluxo Autentique) ───────── */
function FormGerarContrato(p) {
  const d = p.modal.dados || {};           // {imovelId} ou contrato existente p/ regerar
  const regerar = !!d.id;
  const [f, setF] = useState({
    imovelId: d.imovelId||'', inquilinoId: d.inquilinoId||'', inquilinoId2: d.inquilinoId2||'',
    dataInicio: d.dataInicio||hoje(), prazoMeses: d.prazoMeses||30,
    dataFim: d.dataFim||addMeses(hoje(),30),
    diaVencimento: d.diaVencimento||10, valorAluguel: d.valorAluguel||'',
    indice: d.indice||'INPC (Índice Nacional de Preços ao Consumidor)',
    caucaoTipo: d.caucaoTipo||'dinheiro',
    caucaoValor: d.caucaoValor||'', caucaoEquivalente: d.caucaoEquivalente||'02 (dois)',
    caucaoData: d.caucaoData||hoje(),
    pessoas: d.pessoas??0, quintalCompartilhado: d.quintalCompartilhado??false,
    iptuPorConta: d.iptuPorConta||'proprietario',
    aguaNoNomeDela: d.aguaNoNomeDela??false, luzNoNomeDela: d.luzNoNomeDela??false,
    multaAtrasoContrato: d.multaAtrasoContrato??10, jurosMesContrato: d.jurosMesContrato??1,
    dataAssinatura: d.dataAssinatura||hoje(),
    proRataAuto: true, proRataValor: d.proRataValor||'', proRataData: d.proRataData||'', proRataDias: d.proRataDias||''
  });

  const im = p.imoveis.find(x=>x.id===f.imovelId) || {};
  const iq = p.inquilinos.find(x=>x.id===f.inquilinoId);
  const iq2 = p.inquilinos.find(x=>x.id===f.inquilinoId2);

  // pró-rata automático: do início até o 1º vencimento
  const calcProRata = (ini, dia, aluguel) => {
    if (!ini || !num(aluguel)) return {valor:0, data:'', dias:0};
    const d0 = new Date(ini+'T12:00:00');
    let v = new Date(d0.getFullYear(), d0.getMonth(), dia, 12);
    if (v <= d0) v.setMonth(v.getMonth()+1);
    const dias = Math.round((v-d0)/86400000) + 1;   // contagem inclusiva (01→10 = 10 dias)
    if (dias >= 28) return {valor:0, data:'', dias:0};   // mês cheio, sem pró-rata
    return { valor: Math.round(num(aluguel)/30*dias*100)/100,
             data: v.toISOString().slice(0,10), dias };
  };
  const pr = f.proRataAuto ? calcProRata(f.dataInicio, parseInt(f.diaVencimento)||10, f.valorAluguel)
                           : {valor:num(f.proRataValor), data:f.proRataData, dias:parseInt(f.proRataDias)||0};

  const setInicio = v => setF(x=>({ ...x, dataInicio:v,
    dataFim: addMeses(v, parseInt(x.prazoMeses)||30) }));
  const setPrazo = v => setF(x=>({ ...x, prazoMeses:v,
    dataFim: addMeses(x.dataInicio, parseInt(v)||0) }));

  const salvarEGerar = async (soSalvar) => {
    if (!f.imovelId) return p.tst('Escolha a casa');
    if (!f.inquilinoId) return p.tst('Escolha o inquilino');
    if (num(f.valorAluguel)<=0) return p.tst('Informe o valor do aluguel');
    if (f.caucaoTipo==='dinheiro' && num(f.caucaoValor)<=0) return p.tst('Informe o valor da caução');

    const dados = {
      imovelId:f.imovelId, inquilinoId:f.inquilinoId, inquilinoId2:f.inquilinoId2||'',
      dataInicio:f.dataInicio, dataFim:f.dataFim, prazoMeses:parseInt(f.prazoMeses)||30,
      diaVencimento:parseInt(f.diaVencimento)||10, valorAluguel:num(f.valorAluguel),
      indice:f.indice, proximoReajuste:addMeses(f.dataInicio,12),
      caucaoTipo:f.caucaoTipo, caucaoValor:num(f.caucaoValor),
      caucaoEquivalente:f.caucaoEquivalente, caucaoData:f.caucaoData,
      pessoas:parseInt(f.pessoas)||0, quintalCompartilhado:f.quintalCompartilhado,
      iptuPorConta:f.iptuPorConta, aguaNoNomeDela:f.aguaNoNomeDela, luzNoNomeDela:f.luzNoNomeDela,
      multaAtrasoContrato:num(f.multaAtrasoContrato), jurosMesContrato:num(f.jurosMesContrato),
      multaAtraso:num(f.multaAtrasoContrato), jurosDia: Math.round(num(f.jurosMesContrato)/30*1000)/1000,
      multaRescisoria:'3 aluguéis proporcionais (isento após 12 meses)',
      dataAssinatura:f.dataAssinatura,
      proRataValor:pr.valor, proRataData:pr.data, proRataDias:pr.dias,
      status: regerar ? (d.status||'aguardando') : 'aguardando',
      linkContrato: d.linkContrato||''
    };
    const { addDoc, updateDoc, doc, collection } = window.__fs;
    let cid = d.id;
    if (regerar) await updateDoc(doc(window.__db, COL.contratos, d.id), dados);
    else { const r = await addDoc(collection(window.__db, COL.contratos), dados); cid = r.id; }

    if (!soSalvar) {
      const html = gerarContratoHTML({cfg:p.cfg, imovel:im, inquilino:iq, inquilino2:iq2, ct:dados});
      abrirImpressao(html, `Contrato ${im.nome} - ${iq.nome}`);
    }
    p.tst(regerar?'Contrato atualizado ✓':'Contrato criado — aguardando assinatura ⏳');
    p.fechar();
  };

  const faltaLocadora = !p.cfg.locNome || !p.cfg.locCpf;

  return h(Modal,{title: regerar?'Regerar contrato':'Gerar contrato · '+(im.nome||''), onClose:p.fechar},
    faltaLocadora && h('div',{className:'alert a-warn'},
      h('span',null,'⚠️'),
      h('div',null,'Dados da ',h('b',null,'locadora'),' incompletos. Preencha em ',h('b',null,'Config → Dados da locadora'),' antes de gerar (nome e CPF saem no contrato).')),

    !regerar && h(Fld,{label:'Casa *'},
      h('select',{value:f.imovelId, onChange:e=>setF({...f,imovelId:e.target.value})},
        h('option',{value:''},'— escolha —'),
        p.imoveis.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    im.id && !im.descricao && h('div',{className:'alert a-info'},
      h('span',null,'ℹ️'),
      h('div',null,'Esta casa não tem "descrição para contrato" (ex.: SOBRADO RESIDENCIAL COM 2 QUARTOS...). ',
        h('a',{href:'#',className:'lnk',onClick:e=>{e.preventDefault();p.abrir('imovel',im);}},'Preencher agora'))),

    h(Fld,{label:'Inquilino *'},
      h('select',{value:f.inquilinoId, onChange:e=>setF({...f,inquilinoId:e.target.value})},
        h('option',{value:''},'— escolha —'),
        p.inquilinos.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    h(Fld,{label:'2º locatário (cônjuge — opcional)'},
      h('select',{value:f.inquilinoId2, onChange:e=>setF({...f,inquilinoId2:e.target.value})},
        h('option',{value:''},'— nenhum —'),
        p.inquilinos.filter(i=>i.id!==f.inquilinoId).map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    f.inquilinoId2 && h('div',{className:'alert a-info'},
      h('span',null,'💑'),
      h('div',null,'Os dois sairão como LOCATÁRIOS e assinarão no Autentique.')),
    h('button',{className:'btn b-sec b-sm b-full', style:{marginBottom:'13px'},
      onClick:()=>p.abrir('inquilino')},'+ Cadastrar novo inquilino'),
    iq && (!iq.cpf || !iq.rg || !iq.estadoCivil) && h('div',{className:'alert a-warn'},
      h('span',null,'⚠️'),
      h('div',null,'Faltam dados do inquilino p/ contrato (CPF, RG ou estado civil). ',
        h('a',{href:'#',className:'lnk',onClick:e=>{e.preventDefault();p.abrir('inquilino',iq);}},'Completar'))),

    h('div',{className:'sec'},'Vigência e valor'),
    h('div',{className:'row r3'},
      h(Fld,{label:'Início'}, h('input',{type:'date', value:f.dataInicio, onChange:e=>setInicio(e.target.value)})),
      h(Fld,{label:'Prazo (meses)'}, h('input',{value:f.prazoMeses, inputMode:'numeric', onChange:e=>setPrazo(e.target.value)})),
      h(Fld,{label:'Fim'}, h('input',{type:'date', value:f.dataFim, onChange:e=>setF({...f,dataFim:e.target.value})}))),
    h('div',{className:'row r2'},
      h(Fld,{label:'Aluguel mensal *'},
        h('input',{value:f.valorAluguel, inputMode:'decimal', placeholder:'1.300,00',
          onChange:e=>setF({...f,valorAluguel:e.target.value})})),
      h(Fld,{label:'Vencimento (dia)'},
        h('input',{value:f.diaVencimento, inputMode:'numeric',
          onChange:e=>setF({...f,diaVencimento:e.target.value})}))),

    pr.valor>0 && h('div',{className:'alert a-info'},
      h('span',null,'🧮'),
      h('div',null, h('b',null,'1º pagamento pró-rata: '), brl(pr.valor),
        ` (${pr.dias} dias, até ${dbr(pr.data)})`,
        h('div',{style:{fontSize:'12px'}},'Calculado automaticamente e impresso no Quadro Resumo.'))),

    h('div',{className:'sec'},'Garantia'),
    h('div',{className:'row r2'},
      h(Fld,{label:'Tipo'},
        h('select',{value:f.caucaoTipo, onChange:e=>setF({...f,caucaoTipo:e.target.value})},
          h('option',{value:'dinheiro'},'Caução em dinheiro'),
          h('option',{value:'fiador'},'Fiador'),
          h('option',{value:'seguro'},'Seguro-fiança'),
          h('option',{value:'sem'},'Sem garantia'))),
      f.caucaoTipo==='dinheiro' && h(Fld,{label:'Valor da caução *'},
        h('input',{value:f.caucaoValor, inputMode:'decimal', placeholder:'2.600,00',
          onChange:e=>setF({...f,caucaoValor:e.target.value})}))),
    f.caucaoTipo==='dinheiro' && h('div',{className:'row r2'},
      h(Fld,{label:'Equivalente a'},
        h('input',{value:f.caucaoEquivalente, placeholder:'02 (dois)',
          onChange:e=>setF({...f,caucaoEquivalente:e.target.value})})),
      h(Fld,{label:'Pagamento da caução'},
        h('input',{type:'date', value:f.caucaoData, onChange:e=>setF({...f,caucaoData:e.target.value})}))),
    f.caucaoTipo==='fiador' && (!iq || !iq.fiadorNome || !iq.fiadorCpf) && h('div',{className:'alert a-warn'},
      h('span',null,'⚠️'),
      h('div',null,'Cadastre o fiador (nome, CPF, RG, endereço) na ficha do inquilino — ele sai qualificado na Cláusula 8 e assina o contrato. ',
        iq && h('a',{href:'#',className:'lnk',onClick:e=>{e.preventDefault();p.abrir('inquilino',iq);}},'Abrir ficha'))),

    h('div',{className:'sec'},'Cláusulas variáveis'),
    h('div',{className:'row r2'},
      h(Fld,{label:'Residirá com + quantas pessoas'},
        h('input',{value:f.pessoas, inputMode:'numeric', onChange:e=>setF({...f,pessoas:e.target.value})})),
      h(Fld,{label:'Índice de reajuste'},
        h('select',{value:f.indice, onChange:e=>setF({...f,indice:e.target.value})},
          ['INPC (Índice Nacional de Preços ao Consumidor)','IGP-M (Índice Geral de Preços – Mercado)','IPCA (Índice de Preços ao Consumidor Amplo)'].map(x=>h('option',{key:x, value:x}, x.split(' ')[0]))))),
    h('div',{className:'card', style:{background:'#fafbfc', padding:'6px 12px'}},
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.quintalCompartilhado,
          onChange:e=>setF({...f,quintalCompartilhado:e.target.checked})}),
        h('span',null,'Incluir cláusula de quintal compartilhado (5.4)')),
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.iptuPorConta==='proprietario',
          onChange:e=>setF({...f,iptuPorConta:e.target.checked?'proprietario':'inquilino'})}),
        h('span',null,'IPTU incluso no aluguel (responsabilidade da locadora)')),
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.aguaNoNomeDela,
          onChange:e=>setF({...f,aguaNoNomeDela:e.target.checked})}),
        h('span',null,'💧 Água no nome da locadora (repassar na cobrança)')),
      h('label',{className:'sw'},
        h('input',{type:'checkbox', checked:f.luzNoNomeDela,
          onChange:e=>setF({...f,luzNoNomeDela:e.target.checked})}),
        h('span',null,'💡 Luz no nome da locadora (repassar na cobrança)'))),

    h('div',{className:'row r3', style:{marginTop:'13px'}},
      h(Fld,{label:'Multa atraso (%)'},
        h('input',{value:f.multaAtrasoContrato, inputMode:'decimal',
          onChange:e=>setF({...f,multaAtrasoContrato:e.target.value})})),
      h(Fld,{label:'Juros (% a.m.)'},
        h('input',{value:f.jurosMesContrato, inputMode:'decimal',
          onChange:e=>setF({...f,jurosMesContrato:e.target.value})})),
      h(Fld,{label:'Data assinatura'},
        h('input',{type:'date', value:f.dataAssinatura,
          onChange:e=>setF({...f,dataAssinatura:e.target.value})}))),

    h('div',{className:'btns', style:{marginTop:'6px'}},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:()=>salvarEGerar(false)},
        '🖨️ Salvar e gerar PDF'),
      h('button',{className:'btn b-sec', onClick:()=>salvarEGerar(true)},'Só salvar')));
}

/* ───────── MULTA RESCISÓRIA (saída antecipada — Cláusula 9.2) ───────── */
function FormMultaRescisoria(p) {
  const c0 = p.modal.dados;
  const c  = p.contratos.find(x=>x.id===c0.id) || c0;
  const i  = p.imoveis.find(x=>x.id===c.imovelId) || {};
  const q  = p.inquilinos.find(x=>x.id===c.inquilinoId) || {};
  const [saida, setSaida] = useState(hoje());
  const [manual, setManual] = useState('');
  const back = () => p.abrir('verContrato', c);

  const aluguel = num(c.valorAluguel);
  const prazoTotal = parseInt(c.prazoMeses) || Math.max(1, Math.round(
    (new Date(c.dataFim)-new Date(c.dataInicio))/2629800000));
  const isentoApos = addMeses(c.dataInicio, 12);
  const isento = saida >= isentoApos;

  // meses restantes (fracionado por dias)
  const mesesRest = Math.max(0, (new Date(c.dataFim+'T12:00:00') - new Date(saida+'T12:00:00'))/86400000/30);
  const multaCalc = Math.round(3*aluguel*(mesesRest/prazoTotal)*100)/100;
  const valorFinal = manual ? num(manual) : multaCalc;

  const gerar = async () => {
    if (valorFinal<=0) return p.tst('Valor da multa inválido');
    const comp = saida.slice(0,7);
    await salvar(COL.cobrancas, null, {
      contratoId:c.id, imovelId:c.imovelId, inquilinoId:c.inquilinoId,
      competencia:comp, vencimento:saida,
      aluguel:0, iptu:0, agua:0, luz:0,
      outros:valorFinal, obsOutros:'Multa rescisória (Cláusula 9.2) — saída antecipada',
      multa:0, juros:0, desconto:0,
      status:'aberta', criadoEm:new Date().toISOString()
    });
    p.tst('Cobrança da multa gerada ✓ — está na aba Cobranças com PIX e WhatsApp');
    back();
  };

  return h(Modal,{title:'⚖️ Multa por saída antecipada', onClose:back},
    h('div',{className:'card'},
      h(KV,{k:'Casa', v:i.nome||'—'}),
      h(KV,{k:'Inquilino', v:q.nome||'—'}),
      h(KV,{k:'Vigência', v:`${dbr(c.dataInicio)} → ${dbr(c.dataFim)} (${prazoTotal} meses)`}),
      h(KV,{k:'Aluguel atual', v:brl(aluguel)}),
      h(KV,{k:'Isento a partir de', v:dbr(isentoApos)+' (após 12 meses)'})),

    h(Fld,{label:'Data da desocupação'},
      h('input',{type:'date', value:saida, onChange:e=>{setSaida(e.target.value); setManual('');}})),

    isento
      ? h('div',{className:'alert a-info', style:{background:'var(--ok-l)', borderColor:'#a7f3d0'}},
          h('span',null,'✅'),
          h('div',null, h('b',null,'ISENTO de multa.'),
            h('div',{style:{fontSize:'12.5px'}},
              `A saída em ${dbr(saida)} ocorre após os 12 primeiros meses (Cláusula 9.2). `+
              'Só é preciso o aviso prévio de 30 dias e a vistoria de saída (Cláusula 7.1).')))
      : h('div',null,
          h('div',{className:'card', style:{background:'#fff7ed', border:'1px solid #fed7aa'}},
            h('div',{style:{fontSize:'12.5px', color:'var(--mut)', marginBottom:'6px'}},'Memória de cálculo (Cláusula 9.2):'),
            h('div',{style:{fontSize:'13.5px', lineHeight:1.7}},
              `Multa cheia: 3 × ${brl(aluguel)} = ${brl(3*aluguel)}`, h('br'),
              `Tempo restante: ${mesesRest.toFixed(1)} de ${prazoTotal} meses`, h('br'),
              h('b',null,`Proporcional: ${brl(3*aluguel)} × ${(mesesRest/prazoTotal*100).toFixed(1)}% = ${brl(multaCalc)}`))),
          h(Fld,{label:'Valor final (edite se negociar outro)'},
