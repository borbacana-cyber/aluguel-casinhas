/* ───────── DEVOLUÇÃO DA CAUÇÃO (corrigida pela poupança) ───────── */
function FormDevolverCaucao(p) {
  const c0 = p.modal.dados;
  const c  = p.contratos.find(x=>x.id===c0.id) || c0;
  const i  = p.imoveis.find(x=>x.id===c.imovelId) || {};
  const q  = p.inquilinos.find(x=>x.id===c.inquilinoId) || {};
  const movs = p.caucaoMov.filter(m=>m.contratoId===c.id);
  const saldo = movs.reduce((s,m)=>s+(m.tipo==='entrada'?num(m.valor):-num(m.valor)),0);
  const [pct, setPct] = useState('');
  const [vFinalManual, setVFinalManual] = useState('');
  const [descontos, setDescontos] = useState('');
  const [descMotivo, setDescMotivo] = useState('');
  const [data, setData] = useState(hoje());
  const [encerrar, setEncerrar] = useState(true);
  const back = () => p.abrir('verContrato', c);

  const rendimento = vFinalManual
    ? Math.max(0, num(vFinalManual) - saldo)
    : Math.round(saldo*(num(pct)/100)*100)/100;
  const corrigido = saldo + rendimento;
  const vDesc = num(descontos);
  const devolver = Math.max(0, Math.round((corrigido - vDesc)*100)/100);

  const registrar = async () => {
    if (saldo<=0) return p.tst('Sem saldo de caução para devolver');
    if (vDesc>0 && !descMotivo.trim()) return p.tst('Descreva o motivo do desconto');
    if (rendimento>0) await salvar(COL.caucao, null, {
      contratoId:c.id, tipo:'entrada', valor:rendimento, data,
      motivo:`Rendimento poupança do período${pct?` (${pct}%)`:''}`});
    if (vDesc>0) await salvar(COL.caucao, null, {
      contratoId:c.id, tipo:'saida', valor:vDesc, data,
      motivo:'Desconto na devolução: '+descMotivo});
    await salvar(COL.caucao, null, {
      contratoId:c.id, tipo:'saida', valor:devolver, data,
      motivo:'Devolução final da caução ao inquilino'});
    if (encerrar) await salvar(COL.contratos, c.id, {status:'encerrado'});
    p.tst(`Devolução de ${brl(devolver)} registrada ✓${encerrar?' — contrato encerrado':''}`);
    back();
  };

  const msgWhats = () => {
    const msg = `Olá, ${(q.nome||'').split(' ')[0]}! Segue o acerto da caução do imóvel ${i.nome||''}:\n\n`+
      `🔒 Caução: ${brl(saldo)}\n`+
      (rendimento>0?`📈 Correção poupança: + ${brl(rendimento)}\n`:'')+
      (vDesc>0?`🔧 ${descMotivo||'Descontos'}: − ${brl(vDesc)}\n`:'')+
      `\n💰 *Valor a devolver: ${brl(devolver)}*\n`+
      `Farei o PIX em até 5 dias úteis, conforme a Cláusula 8 do contrato. Obrigada!`;
    const tel = soDigitos(q.telefone);
    if (!tel) return p.tst('Inquilino sem WhatsApp cadastrado');
    window.open('https://wa.me/55'+tel+'?text='+encodeURIComponent(msg),'_blank');
  };

  return h(Modal,{title:'💰 Devolver caução', onClose:back},
    h('div',{className:'alert a-info'},
      h('span',null,'🏦'),
      h('div',null,'Pela Cláusula 8, a caução volta ',h('b',null,'corrigida pela poupança'),
        ' em até 5 dias úteis após a vistoria de saída. Pegue o rendimento real no extrato da poupança onde o valor ficou aplicado.')),

    h('div',{className:'card'},
      h(KV,{k:'Saldo da caução', v:brl(saldo)}),
      h(KV,{k:'Recebida em', v: dbr((movs.find(m=>m.tipo==='entrada')||{}).data)})),

    h('div',{className:'row r2'},
      h(Fld,{label:'Correção do período (%)'},
        h('input',{value:pct, inputMode:'decimal', placeholder:'ex.: 13,5',
          onChange:e=>{setPct(e.target.value); setVFinalManual('');}})),
      h(Fld,{label:'OU valor corrigido (extrato)'},
        h('input',{value:vFinalManual, inputMode:'decimal', placeholder:'ex.: 2.950,00',
          onChange:e=>{setVFinalManual(e.target.value); setPct('');}}))),

    h('div',{className:'row r2'},
      h(Fld,{label:'Descontos (reparos etc.)'},
        h('input',{value:descontos, inputMode:'decimal', placeholder:'0,00',
          onChange:e=>setDescontos(e.target.value)})),
      h(Fld,{label:'Data da devolução'},
        h('input',{type:'date', value:data, onChange:e=>setData(e.target.value)}))),
    num(descontos)>0 && h(Fld,{label:'Motivo do desconto *'},
      h('input',{value:descMotivo, placeholder:'ex.: pintura da sala + vidro trincado',
        onChange:e=>setDescMotivo(e.target.value)})),

    h('div',{className:'card', style:{background:'var(--brand-l)', border:'1px solid #99f6e4'}},
      h('div',{style:{fontSize:'13px', lineHeight:1.8}},
        `Caução: ${brl(saldo)}`, h('br'),
        `Correção: + ${brl(rendimento)}`, h('br'),
        vDesc>0 && [`Descontos: − ${brl(vDesc)}`, h('br',{key:'b'})],
        h('b',{style:{fontSize:'17px'}},`A devolver: ${brl(devolver)}`))),

    h('label',{className:'sw', style:{margin:'2px 0 12px'}},
      h('input',{type:'checkbox', checked:encerrar, onChange:e=>setEncerrar(e.target.checked)}),
      h('span',null,'Encerrar o contrato ao registrar')),

    h('div',{className:'btns'},
      h('button',{className:'btn b-wa', onClick:msgWhats},'📱 Avisar'),
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:registrar},'Registrar devolução')));
}

/* ───────── REAJUSTE ───────── */
function FormReajuste(p) {
  const c0 = p.modal.dados;
  const c  = p.contratos.find(x=>x.id===c0.id) || c0;   // valor sempre atual
  const i = p.imoveis.find(x=>x.id===c.imovelId) || {};
  const atual = num(c.valorAluguel);
  const sug = num(p.cfg.igpmAcum);
  const [pc, setPc] = useState(sug ? String(sug).replace('.',',') : '');
  const [data, setData] = useState(c.proximoReajuste || hoje());
  const novo = atual * (1 + num(pc)/100);
  const [manual, setManual] = useState('');
  const valorFinal = manual ? num(manual) : novo;

  const ok = async () => {
    if (valorFinal <= 0) return p.tst('Valor inválido');
    const hist = (c.historicoReajustes||[]).concat([{
      data, percentual: manual ? (((valorFinal/atual)-1)*100).toFixed(2) : num(pc).toFixed(2),
      de: atual, para: valorFinal, indice: c.indice
    }]);
    await salvar(COL.contratos, c.id, {
      valorAluguel: valorFinal,
      proximoReajuste: addMeses(data, 12),
      historicoReajustes: hist
    });
    p.tst('Reajuste aplicado ✓'); p.fechar();
  };

  return h(Modal,{title:'Reajuste · '+(i.nome||''), onClose:p.fechar},
    p.cfg.igpmAcum
      ? h('div',{className:'alert a-info'},
          h('span',null,'📊'),
          h('div',null, h('b',null,'IGP-M acumulado: ', p.cfg.igpmAcum, '%'),
            p.cfg.igpmRef ? ` (ref. ${mesLabel(p.cfg.igpmRef)})` : '',
            h('div',null,'Sugestão — você pode negociar outro percentual.')))
      : h('div',{className:'alert a-warn'},
          h('span',null,'ℹ️'),
          h('div',null,'Cadastre o IGP-M acumulado em Configurações para ver a sugestão.')),

    h(Fld,{label:'Data do reajuste'},
      h('input',{type:'date', value:data, onChange:e=>setData(e.target.value)})),
    h(Fld,{label:'Percentual aplicado (%)'},
      h('input',{value:pc, inputMode:'decimal', autoFocus:true, placeholder:'4,50',
        onChange:e=>{setPc(e.target.value); setManual('');}})),

    h('div',{className:'card', style:{background:'var(--brand-l)', border:'1px solid #99f6e4'}},
      h('div',{style:{display:'flex', justifyContent:'space-between', alignItems:'center'}},
        h('div',null,
          h('div',{style:{fontSize:'12px', color:'var(--mut)'}},'Valor atual'),
          h('div',{style:{fontSize:'17px', fontWeight:700}}, brl(atual))),
        h('div',{style:{fontSize:'20px', color:'var(--brand)'}},'→'),
        h('div',{style:{textAlign:'right'}},
          h('div',{style:{fontSize:'12px', color:'var(--mut)'}},'Novo valor'),
          h('div',{style:{fontSize:'21px', fontWeight:800, color:'var(--brand)'}}, brl(valorFinal))))),

    h(Fld,{label:'Ou digite o valor final direto (arredondamento negociado)'},
      h('input',{value:manual, inputMode:'decimal', placeholder:'ex.: 950,00',
        onChange:e=>setManual(e.target.value)})),

    h('div',{style:{fontSize:'12px', color:'var(--mut)', marginBottom:'12px'}},
      '⚠️ Próximo reajuste será agendado automaticamente para ', dbr(addMeses(data,12)), '.'),

    (() => {
      const q = p.inquilinos.find(x=>x.id===c.inquilinoId) || {};
      const idxNome = (c.indice||'INPC').split(' ')[0];
      const msg = `Olá, ${(q.nome||'').split(' ')[0]}! Tudo bem? 😊\n\n`+
        `Conforme previsto no contrato de locação (Cláusula 4), chegou a data do reajuste anual do aluguel pelo índice ${idxNome}.\n\n`+
        `🏠 Imóvel: ${i.nome||''}\n`+
        `💰 Valor atual: ${brl(atual)}\n`+
        `📈 Novo valor a partir de ${dbr(data)}: *${brl(valorFinal)}*\n\n`+
        `O boleto/PIX do próximo vencimento já virá com o valor atualizado. Qualquer dúvida, estou à disposição!`;
      return h('button',{className:'btn b-sec b-full', style:{marginBottom:'10px'},
        onClick:()=>{
          if (valorFinal<=0) return p.tst('Preencha o percentual ou valor final antes');
          const tel = soDigitos(q.telefone);
          if (!tel) return p.tst('Inquilino sem WhatsApp cadastrado');
          window.open('https://wa.me/55'+tel+'?text='+encodeURIComponent(msg),'_blank');
        }},'📱 Enviar aviso de reajuste (WhatsApp)');
    })(),

    h('button',{className:'btn b-pri b-full', onClick:ok},'Aplicar reajuste'));
}

/* comprime + carimba data/hora e legenda na foto */
function processarFoto(file, legenda) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1000;
        const sc = Math.min(1, MAX/Math.max(img.width, img.height));
        const w = Math.round(img.width*sc), ht = Math.round(img.height*sc);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = ht;
        const cx = cv.getContext('2d');
        cx.drawImage(img, 0, 0, w, ht);
        // faixa do carimbo
        const agora = new Date();
        const carimbo = agora.toLocaleDateString('pt-BR')+' '+
          agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+
          (legenda ? ' — '+legenda : '');
        const fh = Math.max(22, Math.round(ht*0.045));
        cx.fillStyle = 'rgba(0,0,0,0.62)';
        cx.fillRect(0, ht-fh-8, w, fh+8);
        cx.fillStyle = '#fff';
        cx.font = 'bold '+Math.round(fh*0.6)+'px sans-serif';
        cx.textBaseline = 'middle';
        cx.fillText(carimbo, 10, ht-(fh+8)/2, w-20);
        res(cv.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = rej;
      img.src = rd.result;
    };
    rd.onerror = rej;
    rd.readAsDataURL(file);
  });
}

function EditorVistoria(p) {
  const vid = p.modal.dados.id;
  const v = p.vistorias.find(x=>x.id===vid);
  const [itens, setItens] = useState(null);
  const [obs, setObs] = useState('');
  const [linkLaudo, setLinkLaudo] = useState('');
  const [fotos, setFotos] = useState([]);
  const [subindo, setSubindo] = useState(false);
  const fileRef = useRef(null);
  const alvoRef = useRef(-1);

  useEffect(() => {
    if (v && itens===null) { setItens(v.itens||[]); setObs(v.obs||''); setLinkLaudo(v.linkLaudo||''); }
  }, [v]);
  useEffect(() => {
    (async () => {
      const { getDocs, query, where, collection } = window.__fs;
      const s = await getDocs(query(collection(window.__db, COL.vfotos), where('vistoriaId','==',vid)));
      setFotos(s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.ts||'').localeCompare(b.ts||'')));
    })();
  }, [vid]);

  if (!v || itens===null) return null;
  const im = p.imoveis.find(x=>x.id===v.imovelId) || {};
  const ct = p.contratos.find(x=>x.id===v.contratoId);
  const iq = ct ? p.inquilinos.find(x=>x.id===ct.inquilinoId) : null;
  const back = () => p.abrir('verImovel', im);

  const gravar = async (silencioso) => {
    await salvar(COL.vistorias, vid, { itens, obs, linkLaudo });
    if (!silencioso) p.tst('Vistoria salva ✓');
  };

  const tirarFoto = ix => { alvoRef.current = ix; fileRef.current.click(); };
  const onFile = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setSubindo(true);
    try {
      const ix = alvoRef.current;
      const legenda = ix>=0 ? (itens[ix]?.t||'') : 'Geral';
      const dataUrl = await processarFoto(file, `${legenda} — ${im.nome||''}`);
      if (dataUrl.length > 850000) { p.tst('Foto muito grande mesmo comprimida — tente outra'); setSubindo(false); return; }
      const { addDoc, collection } = window.__fs;
      const r = await addDoc(collection(window.__db, COL.vfotos), {
        vistoriaId:vid, itemIdx:ix, dataUrl, ts:new Date().toISOString()
      });
      setFotos(fs=>[...fs, {id:r.id, vistoriaId:vid, itemIdx:ix, dataUrl, ts:new Date().toISOString()}]);
      p.tst('Foto adicionada 📷');
    } catch(err) { console.error(err); p.tst('Erro ao processar a foto'); }
    setSubindo(false);
  };
  const delFoto = async f => {
    if (!confirm('Excluir esta foto?')) return;
    await remover(COL.vfotos, f.id);
    setFotos(fs=>fs.filter(x=>x.id!==f.id));
  };

  const laudo = async () => {
    await gravar(true);
    const html = gerarLaudoHTML({cfg:p.cfg, imovel:im, inquilino:iq,
      vist:{...v, itens, obs}, fotos});
    abrirImpressao(html, `Laudo ${im.nome} ${dbr(v.data)}`);
  };
  const delVistoria = async () => {
    if (!confirm('Excluir esta vistoria e todas as fotos?')) return;
    for (const f of fotos) await remover(COL.vfotos, f.id);
    await remover(COL.vistorias, vid);
    p.tst('Vistoria excluída'); back();
  };

  const setItem = (ix, campo, val) =>
    setItens(arr => arr.map((x,i)=> i===ix ? {...x,[campo]:val} : x));

  const tituloTipo = v.tipo==='entrada'?'➡️ Entrada':v.tipo==='saida'?'⬅️ Saída':'🔍 Periódica';

  return h(Modal,{title:`Vistoria ${tituloTipo} · ${im.nome||''}`, onClose:back},
    h('input',{type:'file', accept:'image/*', capture:'environment', ref:fileRef,
      style:{display:'none'}, onChange:onFile}),
    h('div',{className:'cs', style:{marginBottom:'12px'}},
      dbr(v.data), iq ? ' · '+iq.nome : '',
      subindo && h('span',{style:{color:'var(--brand)', fontWeight:700}},' · processando foto…')),

    itens.map((it, ix) => {
      const fts = fotos.filter(f=>f.itemIdx===ix);
      return h('div',{key:ix, className:'card', style:{padding:'11px'}},
        h('div',{style:{display:'flex', gap:'8px', alignItems:'center', marginBottom:'7px'}},
          h('input',{value:it.t, style:{fontWeight:700, flex:1},
            onChange:e=>setItem(ix,'t',e.target.value)}),
          h('button',{className:'btn b-sec b-sm', onClick:()=>tirarFoto(ix)},'📷'),
          h('button',{style:{color:'var(--bad)', fontSize:'18px', padding:'0 4px'},
            onClick:()=>{ if(confirm('Remover o item "'+it.t+'"?')) setItens(a=>a.filter((_,i)=>i!==ix)); }},'×')),
        h('textarea',{value:it.txt, rows:3, onChange:e=>setItem(ix,'txt',e.target.value)}),
        fts.length>0 && h('div',{style:{display:'flex', gap:'6px', flexWrap:'wrap', marginTop:'8px'}},
          fts.map(f => h('img',{key:f.id, src:f.dataUrl,
            style:{width:'72px', height:'72px', objectFit:'cover', borderRadius:'8px',
              border:'1px solid var(--line)'},
            onClick:()=>delFoto(f)}))));
    }),

    h('div',{className:'btns', style:{margin:'4px 0 14px'}},
      h('button',{className:'btn b-sec b-sm', style:{flex:1},
        onClick:()=>setItens(a=>[...a,{t:'NOVO ITEM', txt:''}])},'+ Item'),
      h('button',{className:'btn b-sec b-sm', style:{flex:1},
        onClick:()=>tirarFoto(-1)},'📷 Foto geral')),

    fotos.filter(f=>f.itemIdx===-1).length>0 && h('div',{style:{display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'13px'}},
      fotos.filter(f=>f.itemIdx===-1).map(f => h('img',{key:f.id, src:f.dataUrl,
        style:{width:'72px', height:'72px', objectFit:'cover', borderRadius:'8px', border:'1px solid var(--line)'},
        onClick:()=>delFoto(f)}))),

    h(Fld,{label:'Observações gerais'},
      h('textarea',{value:obs, onChange:e=>setObs(e.target.value)})),
    h(Fld,{label:'Link do laudo assinado (depois do Autentique)'},
      h('input',{value:linkLaudo, placeholder:'https://…', onChange:e=>setLinkLaudo(e.target.value)})),

    h('div',{style:{fontSize:'12px', color:'var(--mut)', marginBottom:'11px'}},
      '💡 Toque numa foto para excluí-la. ', fotos.length, ' foto(s) nesta vistoria.'),

    h('div',{className:'btns'},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:()=>gravar(false)},'💾 Salvar'),
      h('button',{className:'btn b-sec', onClick:laudo},'🖨️ Laudo PDF'),
      h('button',{className:'btn b-bad', onClick:delVistoria},'🗑')));
}

/* ───────── MODELO DE VISTORIA POR CASA ───────── */
function ModeloVistoria(p) {
  const im0 = p.modal.dados;
  const im = p.imoveis.find(x=>x.id===im0.id) || im0;
  const [itens, setItens] = useState(
    (im.vistoriaModelo && im.vistoriaModelo.length ? im.vistoriaModelo : VISTORIA_PADRAO)
      .map(x=>({t:x.t, txt:x.txt})));
  const back = () => p.abrir('verImovel', im);
  const gravar = async () => {
    await salvar(COL.imoveis, im.id, { vistoriaModelo: itens });
    p.tst('Modelo salvo ✓'); back();
  };
  const setItem=(ix,c,v)=>setItens(a=>a.map((x,i)=>i===ix?{...x,[c]:v}:x));
  const mover=(ix,dir)=>setItens(a=>{
    const b=a.slice(); const j=ix+dir;
    if(j<0||j>=b.length) return a;
    [b[ix],b[j]]=[b[j],b[ix]]; return b;
  });
  return h(Modal,{title:'Modelo de vistoria · '+(im.nome||''), onClose:back},
    h('div',{className:'alert a-info'},
      h('span',null,'📋'),
      h('div',null,'Este é o texto padrão desta casa. Toda vistoria nova nasce com esses itens preenchidos — ajuste os cômodos e descrições uma vez só.')),
    itens.map((it,ix)=>h('div',{key:ix, className:'card', style:{padding:'11px'}},
      h('div',{style:{display:'flex', gap:'6px', alignItems:'center', marginBottom:'7px'}},
        h('input',{value:it.t, style:{fontWeight:700, flex:1}, onChange:e=>setItem(ix,'t',e.target.value)}),
        h('button',{className:'btn b-sec b-sm', onClick:()=>mover(ix,-1)},'↑'),
        h('button',{className:'btn b-sec b-sm', onClick:()=>mover(ix,1)},'↓'),
        h('button',{style:{color:'var(--bad)', fontSize:'18px', padding:'0 4px'},
          onClick:()=>{ if(confirm('Remover "'+it.t+'" do modelo?')) setItens(a=>a.filter((_,i)=>i!==ix)); }},'×')),
      h('textarea',{value:it.txt, rows:2, onChange:e=>setItem(ix,'txt',e.target.value)}))),
    h('button',{className:'btn b-sec b-sm b-full', style:{marginBottom:'12px'},
      onClick:()=>setItens(a=>[...a,{t:'NOVO ITEM', txt:''}])},'+ Adicionar item'),
    h('button',{className:'btn b-pri b-full', onClick:gravar},'💾 Salvar modelo'));
}

/* ───────── COBRANÇA ───────── */
function FormCobranca(p) {
  const d = p.modal.dados || {};
  const [f, setF] = useState({
    contratoId:d.contratoId||'', competencia:d.competencia||mesAtual(),
    vencimento:d.vencimento||'', aluguel:d.aluguel||'',
    iptu:d.iptu||'', agua:d.agua||'', luz:d.luz||'', outros:d.outros||'',
    obsOutros:d.obsOutros||'', desconto:d.desconto||''
  });
  const c = p.contratos.find(x=>x.id===f.contratoId);

  const pickContrato = id => {
    const ct = p.contratos.find(x=>x.id===id);
    if (!ct) return setF({...f, contratoId:id});
    const dia = String(ct.diaVencimento||10).padStart(2,'0');
    setF({...f, contratoId:id, aluguel:ct.valorAluguel,
      vencimento:`${f.competencia}-${dia}`});
  };

  const ok = async () => {
    if (!f.contratoId) return p.tst('Escolha o contrato');
    const ct = p.contratos.find(x=>x.id===f.contratoId);
    await salvar(COL.cobrancas, d.id, {
      contratoId:f.contratoId, imovelId:ct.imovelId, inquilinoId:ct.inquilinoId,
      competencia:f.competencia, vencimento:f.vencimento,
      aluguel:num(f.aluguel), iptu:num(f.iptu), agua:num(f.agua), luz:num(f.luz),
      outros:num(f.outros), obsOutros:f.obsOutros, desconto:num(f.desconto),
      multa:num(d.multa), juros:num(d.juros),
      status: d.status||'aberta',
      dataPagamento: d.dataPagamento||'', comprovante: d.comprovante||''
    });
    p.tst('Salvo ✓'); p.fechar();
  };
  const del = async () => {
    if (!confirm('Excluir cobrança?')) return;
    await remover(COL.cobrancas, d.id); p.tst('Excluída'); p.fechar();
  };

  const tot = num(f.aluguel)+num(f.iptu)+num(f.agua)+num(f.luz)+num(f.outros)-num(f.desconto);

  return h(Modal,{title: d.id?'Editar cobrança':'Nova cobrança', onClose:p.fechar},
    h(Fld,{label:'Contrato *'},
      h('select',{value:f.contratoId, onChange:e=>pickContrato(e.target.value)},
        h('option',{value:''},'— escolha —'),
        p.contratos.filter(x=>x.status==='vigente').map(x=>{
          const i = p.imoveis.find(y=>y.id===x.imovelId)||{};
          const q = p.inquilinos.find(y=>y.id===x.inquilinoId)||{};
          return h('option',{key:x.id, value:x.id}, `${i.nome} — ${q.nome}`);
        }))),
    h('div',{className:'row r2'},
      h(Fld,{label:'Competência'},
        h('input',{type:'month', value:f.competencia,
          onChange:e=>setF({...f, competencia:e.target.value})})),
      h(Fld,{label:'Vencimento'},
        h('input',{type:'date', value:f.vencimento, onChange:e=>setF({...f,vencimento:e.target.value})}))),
    h(Fld,{label:'Aluguel'},
      h('input',{value:f.aluguel, inputMode:'decimal', onChange:e=>setF({...f,aluguel:e.target.value})})),

    h('div',{className:'sec'},'Encargos deste mês'),
    h('div',{className:'row r3'},
      c && c.iptuPorConta==='inquilino' && h(Fld,{label:'IPTU'},
        h('input',{value:f.iptu, inputMode:'decimal', onChange:e=>setF({...f,iptu:e.target.value})})),
      c && c.aguaNoNomeDela && h(Fld,{label:'💧 Água'},
        h('input',{value:f.agua, inputMode:'decimal', onChange:e=>setF({...f,agua:e.target.value})})),
      c && c.luzNoNomeDela && h(Fld,{label:'💡 Luz'},
        h('input',{value:f.luz, inputMode:'decimal', onChange:e=>setF({...f,luz:e.target.value})}))),
    c && !c.aguaNoNomeDela && !c.luzNoNomeDela && c.iptuPorConta!=='inquilino' &&
      h('div',{style:{fontSize:'12.5px', color:'var(--mut)', marginBottom:'12px'}},
        'Este contrato não tem encargos a repassar (água, luz e IPTU no nome do inquilino).'),

    h('div',{className:'row r2'},
      h(Fld,{label:'Outros'},
        h('input',{value:f.outros, inputMode:'decimal', onChange:e=>setF({...f,outros:e.target.value})})),
      h(Fld,{label:'Desconto'},
        h('input',{value:f.desconto, inputMode:'decimal', onChange:e=>setF({...f,desconto:e.target.value})}))),
    num(f.outros)>0 && h(Fld,{label:'Descrição de "outros"'},
      h('input',{value:f.obsOutros, onChange:e=>setF({...f,obsOutros:e.target.value})})),

    h('div',{className:'card', style:{background:'var(--brand-l)', border:'1px solid #99f6e4',
      display:'flex', justifyContent:'space-between', alignItems:'center'}},
      h('span',{style:{fontWeight:650}},'Total'),
      h('span',{style:{fontSize:'20px', fontWeight:800, color:'var(--brand)'}}, brl(tot))),

    h('div',{className:'btns'},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:ok},'Salvar'),
      d.id && h('button',{className:'btn b-bad', onClick:del},'Excluir')));
}

function VerCobranca(p) {
  const c = p.modal.dados;
  const cAtual = p.cobrancas.find(x=>x.id===c.id) || c;
  const ct = p.contratos.find(x=>x.id===cAtual.contratoId) || {};
  const i  = p.imoveis.find(x=>x.id===cAtual.imovelId) || {};
  const q  = p.inquilinos.find(x=>x.id===cAtual.inquilinoId) || {};
  const st = statusCobranca(cAtual);
  const atrasoDias = Math.max(0, diasEntre(cAtual.vencimento, hoje()));
  const total = totalCobranca(cAtual);
  const cfg = p.cfg;

  const [pgto, setPgto] = useState(false);
  const [dp, setDp]     = useState(hoje());

  const temPix = !!cfg.pixChave;
  const payload = temPix ? pixPayload({
    chave: cfg.pixChave, nome: cfg.pixNome, cidade: cfg.pixCidade,
    valor: total, txid: (i.nome||'AL').replace(/\W/g,'').slice(0,10).toUpperCase() + (cAtual.competencia||'').replace('-','')
  }) : '';

  const aplicarJuros = async () => {
    if (atrasoDias <= 0) return p.tst('Não está em atraso');
    const base = num(cAtual.aluguel) + encargosDoMes(cAtual);
    const pm = ct.multaAtraso ?? cfg.multaAtraso ?? 2;
    const pj = ct.jurosDia  ?? cfg.jurosDia  ?? 0.033;
    const multa = base * (num(pm)/100);
    const juros = base * (num(pj)/100) * atrasoDias;
    await salvar(COL.cobrancas, cAtual.id, {
      multa: Math.round(multa*100)/100, juros: Math.round(juros*100)/100
    });
    p.tst(`Multa ${brl(multa)} + juros ${brl(juros)} ✓`);
  };
  const limparJuros = async () => {
    await salvar(COL.cobrancas, cAtual.id, { multa:0, juros:0 });
    p.tst('Zerado');
  };
  const baixar = async () => {
    await salvar(COL.cobrancas, cAtual.id, { status:'pago', dataPagamento: dp });
    p.tst('Pagamento registrado ✓'); p.fechar();
  };
  const estornar = async () => {
    await salvar(COL.cobrancas, cAtual.id, { status:'aberta', dataPagamento:'' });
    p.tst('Estornado');
  };

  const linhas = [];
  linhas.push(`*${i.nome||'Aluguel'}* — ${mesLabel(cAtual.competencia)}`);
  linhas.push('');
  linhas.push(`Aluguel: ${brl(num(cAtual.aluguel))}`);
  if (num(cAtual.iptu)>0)  linhas.push(`IPTU: ${brl(num(cAtual.iptu))}`);
  if (num(cAtual.agua)>0)  linhas.push(`Água: ${brl(num(cAtual.agua))}`);
  if (num(cAtual.luz)>0)   linhas.push(`Luz: ${brl(num(cAtual.luz))}`);
  if (num(cAtual.outros)>0) linhas.push(`${cAtual.obsOutros||'Outros'}: ${brl(num(cAtual.outros))}`);
  if (num(cAtual.multa)>0) linhas.push(`Multa por atraso: ${brl(num(cAtual.multa))}`);
  if (num(cAtual.juros)>0) linhas.push(`Juros (${atrasoDias} dias): ${brl(num(cAtual.juros))}`);
  if (num(cAtual.desconto)>0) linhas.push(`Desconto: -${brl(num(cAtual.desconto))}`);
  linhas.push('');
  linhas.push(`*Total: ${brl(total)}*`);
  linhas.push(`Vencimento: ${dbr(cAtual.vencimento)}`);
  if (temPix) {
    linhas.push('');
    linhas.push('Pix copia e cola:');
    linhas.push(payload);
    linhas.push('');
    linhas.push('_Após pagar, envie o comprovante aqui. Obrigada!_');
  }
  const msg = linhas.join('\n');
  const waUrl = q.telefone
    ? `https://wa.me/55${soDigitos(q.telefone)}?text=${encodeURIComponent(msg)}`
    : '';

  return h(Modal,{title: `${i.nome||'?'} · ${mesLabel(cAtual.competencia)}`, onClose:p.fechar},
    h('div',{style:{textAlign:'center', margin:'0 0 14px'}},
      h('div',{style:{fontSize:'32px', fontWeight:800, letterSpacing:'-1px'}}, brl(total)),
      h('span',{className:'chip '+st.c}, st.t)),

    h('div',{className:'card'},
      h(KV,{k:'Inquilino', v:q.nome||'—'}),
      h(KV,{k:'Vencimento', v:dbr(cAtual.vencimento)}),
      h(KV,{k:'Aluguel', v:brl(num(cAtual.aluguel))}),
      num(cAtual.iptu)>0 && h(KV,{k:'IPTU', v:brl(num(cAtual.iptu))}),
      num(cAtual.agua)>0 && h(KV,{k:'💧 Água', v:brl(num(cAtual.agua))}),
      num(cAtual.luz)>0  && h(KV,{k:'💡 Luz', v:brl(num(cAtual.luz))}),
      num(cAtual.outros)>0 && h(KV,{k:cAtual.obsOutros||'Outros', v:brl(num(cAtual.outros))}),
      num(cAtual.multa)>0 && h(KV,{k:'Multa', v:brl(num(cAtual.multa))}),
      num(cAtual.juros)>0 && h(KV,{k:`Juros (${atrasoDias}d)`, v:brl(num(cAtual.juros))}),
      num(cAtual.desconto)>0 && h(KV,{k:'Desconto', v:'−'+brl(num(cAtual.desconto))}),
      cAtual.status==='pago' && h(KV,{k:'Pago em', v:dbr(cAtual.dataPagamento)})),

    cAtual.status!=='pago' && atrasoDias>0 && h('div',{className:'btns', style:{marginTop:'10px'}},
      num(cAtual.multa)===0 && num(cAtual.juros)===0
        ? h('button',{className:'btn b-sec b-sm b-full', onClick:aplicarJuros},
            `⚡ Aplicar multa ${ct.multaAtraso ?? cfg.multaAtraso ?? 2}% + juros ${atrasoDias} dias`)
        : h('button',{className:'btn b-sec b-sm b-full', onClick:limparJuros},'↺ Remover multa e juros')),

    !temPix && h('div',{className:'alert a-warn', style:{marginTop:'12px'}},
      h('span',null,'⚠️'),
      h('div',null,'Chave PIX não cadastrada. Vá em ',h('b',null,'Config'),' para gerar o código de pagamento.')),

    temPix && h('div',null,
      h('div',{className:'sec'},'Código PIX (valor exato)'),
      h('div',{className:'pix'}, payload),
      h('button',{className:'btn b-sec b-full b-sm', style:{marginTop:'8px'},
        onClick:()=>{navigator.clipboard.writeText(payload); p.tst('Código PIX copiado');}},
        '📋 Copiar código PIX')),

    cAtual.status!=='pago' && h('div',{style:{marginTop:'14px'}},
      waUrl
        ? h('a',{href:waUrl, target:'_blank', className:'btn b-wa b-full',
            style:{textDecoration:'none', marginBottom:'8px'}},'💬 Enviar cobrança no WhatsApp')
        : h('div',{className:'alert a-warn'}, h('span',null,'⚠️'),
            h('div',null,'Inquilino sem WhatsApp cadastrado.')),
      h('button',{className:'btn b-sec b-full b-sm', style:{marginBottom:'8px'},
        onClick:()=>{navigator.clipboard.writeText(msg); p.tst('Mensagem copiada');}},
        '📋 Copiar mensagem completa')),

    h('div',{className:'hr'}),

    cAtual.status==='pago'
      ? h('div',{className:'btns'},
          h('button',{className:'btn b-sec', style:{flex:1}, onClick:()=>p.abrir('cobranca', cAtual)},'✏️ Editar'),
          h('button',{className:'btn b-bad', onClick:estornar},'↺ Estornar'))
      : !pgto
        ? h('div',{className:'btns'},
            h('button',{className:'btn b-ok', style:{flex:1}, onClick:()=>setPgto(true)},'✅ Dar baixa (recebi)'),
            h('button',{className:'btn b-sec', onClick:()=>p.abrir('cobranca', cAtual)},'✏️'))
        : h('div',{className:'card', style:{background:'var(--ok-l)', border:'1px solid #a7f3d0'}},
            h(Fld,{label:'Data do recebimento'},
              h('input',{type:'date', value:dp, onChange:e=>setDp(e.target.value)})),
            h('div',{className:'btns'},
              h('button',{className:'btn b-ok', style:{flex:1}, onClick:baixar},'Confirmar recebimento'),
              h('button',{className:'btn b-sec', onClick:()=>setPgto(false)},'Cancelar'))));
}

/* ───────── DESPESA ───────── */
function FormDespesa(p) {
  const d = p.modal.dados || {};
  const [f, setF] = useState({
    imovelId:d.imovelId||'', descricao:d.descricao||'', categoria:d.categoria||'Manutenção',
    valor:d.valor||'', data:d.data||hoje(), fornecedor:d.fornecedor||'', linkNota:d.linkNota||''
  });
  const ok = async () => {
    if (!f.descricao.trim()) return p.tst('Descreva a despesa');
    if (num(f.valor)<=0) return p.tst('Informe o valor');
    await salvar(COL.despesas, d.id, {...f, valor:num(f.valor)});
    p.tst('Salvo ✓'); p.fechar();
  };
  const del = async () => {
    if (!confirm('Excluir despesa?')) return;
    await remover(COL.despesas, d.id); p.tst('Excluída'); p.fechar();
  };
  const CATS = ['Manutenção','Reforma','Pintura','Hidráulica','Elétrica','IPTU','Água','Luz','Material','Mão de obra','Documentação','Outros'];
  return h(Modal,{title: d.id?'Editar despesa':'Nova despesa', onClose:p.fechar},
    h(Fld,{label:'Casa'},
      h('select',{value:f.imovelId, onChange:e=>setF({...f,imovelId:e.target.value})},
        h('option',{value:''},'— geral (sem casa) —'),
        p.imoveis.map(i=>h('option',{key:i.id, value:i.id}, i.nome)))),
    h(Fld,{label:'Descrição *'},
      h('input',{value:f.descricao, autoFocus:true, placeholder:'Troca do chuveiro',
        onChange:e=>setF({...f,descricao:e.target.value})})),
    h('div',{className:'row r2'},
      h(Fld,{label:'Valor *'},
        h('input',{value:f.valor, inputMode:'decimal', onChange:e=>setF({...f,valor:e.target.value})})),
      h(Fld,{label:'Data'},
        h('input',{type:'date', value:f.data, onChange:e=>setF({...f,data:e.target.value})}))),
    h('div',{className:'row r2'},
      h(Fld,{label:'Categoria'},
        h('select',{value:f.categoria, onChange:e=>setF({...f,categoria:e.target.value})},
          CATS.map(c=>h('option',{key:c},c)))),
      h(Fld,{label:'Fornecedor'},
        h('input',{value:f.fornecedor, onChange:e=>setF({...f,fornecedor:e.target.value})}))),
    h(Fld,{label:'Link da nota/foto do recibo'},
      h('input',{value:f.linkNota, placeholder:'https://…', onChange:e=>setF({...f,linkNota:e.target.value})})),
    h('div',{className:'btns'},
      h('button',{className:'btn b-pri', style:{flex:1}, onClick:ok},'Salvar'),
      d.id && h('button',{className:'btn b-bad', onClick:del},'Excluir')));
}
